<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Phone</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Phone">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg-deep:#0a0e1a; --bg-mid:#161b2e; --wallpaper-a:#1a2140; --wallpaper-b:#3a2e5c;
  --accent:#8fe3d4; --accent-dim:#4f7d75;
  --ink:#f2f4f8; --ink-dim:#9aa3b8; --ink-faint:#5c6480;
  --glass:rgba(255,255,255,0.08); --glass-border:rgba(255,255,255,0.14);
  --danger:#e37878;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg-deep);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#frame{
  position:relative;
  width:100%;max-width:420px;height:100%;max-height:900px;
  background:linear-gradient(160deg,var(--wallpaper-a),var(--wallpaper-b) 70%);
  border-radius:0px;overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,0.5);
}
@media (min-width:480px) and (min-height:760px){
  #frame{border-radius:44px;border:8px solid #05060a;height:860px;}
}
/* ---------- status bar ---------- */
/* ---------- lock screen ---------- */
#lock{
  position:absolute;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;
  padding-top:14%;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;
  touch-action:none;
}
#lock.hidden{transform:translateY(-100%);opacity:0;pointer-events:none;}
#lock .time{font-size:74px;font-weight:200;line-height:1;letter-spacing:-1px;}
#lock .date{font-size:15px;color:var(--ink-dim);margin-top:8px;}
#lock .hint{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  left:0;right:0;text-align:center;font-size:13px;color:var(--ink-dim);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:pulse 2.4s ease-in-out infinite;
  cursor:pointer;user-select:none;
}
#lock .hint .bar{width:120px;height:4px;border-radius:3px;background:var(--ink-dim);opacity:.6;}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

#passpad{
  position:absolute;inset:0;z-index:41;background:rgba(10,14,26,0.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
}
#passpad.show{transform:translateY(0);}
#passpad .label{font-size:14px;color:var(--ink-dim);}
#passpad .dots{display:flex;gap:16px;}
#passpad .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink-dim);}
#passpad .dot.filled{background:var(--ink);border-color:var(--ink);}
#passpad .dot.err{background:var(--danger);border-color:var(--danger);}
#passpad .keys{display:grid;grid-template-columns:repeat(3,64px);gap:16px;}
#passpad .key{
  width:64px;height:64px;border-radius:50%;background:var(--glass);
  border:1px solid var(--glass-border);color:var(--ink);font-size:22px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
#passpad .key:active{background:rgba(255,255,255,0.2);}
#passpad .key.ghost{background:transparent;border:none;}
#passpad .backbtn{margin-top:6px;font-size:13px;color:var(--ink-dim);cursor:pointer;}

/* ---------- home screen ---------- */
#home{position:absolute;inset:0;z-index:10;padding:0 22px;padding-top:calc(env(safe-area-inset-top,0px) + 28px);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px;}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.app .icon{
  width:58px;height:58px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(6px);
}
.app .label{font-size:11.5px;color:var(--ink);text-align:center;}
.app:active .icon{transform:scale(0.92);}

/* ---------- app screens ---------- */
.screen{
  position:absolute;inset:0;z-index:30;background:var(--bg-mid);
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
}
.screen.show{transform:translateY(0);}
.screen header{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px;
  border-bottom:1px solid var(--glass-border);
  flex:0 0 auto;
}
.screen header .back{cursor:pointer;color:var(--accent);font-size:15px;}
.screen header h2{font-size:17px;font-weight:600;margin:0;flex:1;}
.screen .body{flex:1;overflow-y:auto;padding:18px;}

.placeholder{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--ink-faint);text-align:center;padding:0 30px;
}
.placeholder .big{font-size:32px;}
.placeholder .t{font-size:14px;color:var(--ink-dim);}

/* ---------- settings form ---------- */
fieldset{border:1px solid var(--glass-border);border-radius:12px;padding:14px;margin-bottom:16px;}
legend{font-size:13px;color:var(--accent);padding:0 6px;}
label{display:block;font-size:12.5px;color:var(--ink-dim);margin:10px 0 5px;}
input[type=text],input[type=password],select{
  width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.05);color:var(--ink);font-size:14px;outline:none;
}
input:focus,select:focus{border-color:var(--accent);}
.savebar{
  position:sticky;bottom:0;display:flex;gap:10px;padding-top:6px;
}
button.primary{
  flex:1;padding:12px;border-radius:10px;border:none;background:var(--accent);
  color:#0a2420;font-weight:600;font-size:14.5px;cursor:pointer;
}
button.primary:active{opacity:.85;}
.saved-msg{font-size:12.5px;color:var(--accent);text-align:center;height:16px;margin-top:8px;}

.importbtn{display:block;text-align:center;padding:12px;border-radius:10px;border:1px dashed var(--glass-border);color:var(--accent);font-size:13.5px;cursor:pointer;margin-bottom:16px;}
.emptylist{color:var(--ink-faint);font-size:13px;text-align:center;padding:30px 0;}
.plist-item{border:1px solid var(--glass-border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.plist-head{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;}
.plist-head .nm{font-size:14px;}
.plist-head .sub{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.plist-body{display:none;padding:0 12px 10px;}
.plist-body.open{display:block;}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,0.06);}
.prow .pname{flex:1;font-size:12.5px;cursor:pointer;}
.prow textarea{width:100%;min-height:80px;margin-top:6px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:8px;color:var(--ink);font-size:12px;padding:8px;flex-basis:100%;}
.toggle{width:38px;height:22px;border-radius:12px;background:var(--glass-border);position:relative;cursor:pointer;flex:0 0 auto;}
.toggle.on{background:var(--accent);}
.toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle.on .knob{left:18px;}
.scopebtn{font-size:11px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:8px;padding:3px 8px;cursor:pointer;flex:0 0 auto;}
.inlinebox{margin-bottom:16px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:12px;}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px;}
.chip{font-size:11px;padding:4px 9px;border-radius:8px;border:1px solid var(--glass-border);color:var(--ink-dim);cursor:pointer;}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(143,227,212,0.1);}
.avatar{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--glass);}
.plist-body textarea[readonly]{width:100%;min-height:60px;margin:6px 0 10px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:8px;color:var(--ink);font-size:12px;padding:8px;}
.chatmsg{margin-bottom:16px;}
.bubblehead{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.bubblehead .bname{font-size:13px;font-weight:600;}
.bubblehead .bts{font-size:10.5px;color:var(--ink-faint);}
.bubbletext{font-size:14px;line-height:1.6;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:10px 12px;white-space:pre-wrap;}
.bubbletools{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--ink-faint);}
.bubbletools span{cursor:pointer;}
.bubbletools span:hover{color:var(--accent);}
.bubbletools{align-items:center;}
.swipenav{display:flex;align-items:center;gap:2px;margin-left:auto;color:var(--accent);}
.swipenav .arrow{padding:2px 10px;font-size:20px;line-height:1;user-select:none;}
.swipenav .pg{min-width:34px;text-align:center;color:var(--ink-dim);font-size:12px;}
#of-inputbar{align-items:flex-end;}
#of-input{flex:1;width:auto;margin:0;min-height:42px;max-height:140px;resize:none;padding:10px 11px;border-radius:9px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--ink);font-size:14px;line-height:1.5;font-family:inherit;outline:none;overflow-y:auto;}
#of-input:focus{border-color:var(--accent);}
.bubblebox{background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;overflow:hidden}
.bubblebox .bubbletext{background:none;border:0;border-radius:0}
.bubblebox .bubbletext.rich{padding:0;white-space:normal}
.bubblebox .swipenav{display:flex;justify-content:flex-end;margin:0;padding:0 8px 6px}
.rich-frame{width:100%;border:0;display:block;background:transparent}
</style>
</head>
<body>
<div id="frame">
  <div id="home">
    <div class="grid" id="appgrid"></div>
  </div>

  <div id="lock">
    <div class="time" id="lock-time">--:--</div>
    <div class="date" id="lock-date"></div>
    <div class="hint" id="swipeup">
      <div class="bar"></div>
      向上滑动解锁
    </div>
  </div>

  <div id="passpad">
    <div class="label" id="pp-label">输入密码</div>
    <div class="dots" id="pp-dots"></div>
    <div class="keys" id="pp-keys"></div>
    <div class="backbtn" id="pp-cancel">取消</div>
  </div>

  <div id="app-screens"></div>
</div>

<script>
/* ---------------- clock ---------------- */
function fmtTime(d){return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function fmtDate(d){
  const w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+w;
}
function tick(){
  const d=new Date();
  document.getElementById('lock-time').textContent=fmtTime(d);
  document.getElementById('lock-date').textContent=fmtDate(d);
}
tick(); setInterval(tick,1000*10);

/* ---------------- storage helpers ---------------- */
function loadJSON(key,fallback){
  try{const v=localStorage.getItem(key); return v?JSON.parse(v):fallback;}catch(e){return fallback;}
}
function saveJSON(key,val){
  try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}
}

/* ---------------- lock / passcode ---------------- */
const lock=document.getElementById('lock');
const passpad=document.getElementById('passpad');
const ppDots=document.getElementById('pp-dots');
const ppKeys=document.getElementById('pp-keys');
const ppLabel=document.getElementById('pp-label');
let currentInput='';
let mode='unlock'; // unlock | setnew | confirmnew
let pendingNew='';

function getPass(){return loadJSON('ai-phone-pass','0000');}
function setPass(p){saveJSON('ai-phone-pass',p);}

function renderDots(err){
  ppDots.innerHTML='';
  for(let i=0;i<4;i++){
    const d=document.createElement('div');
    d.className='dot'+(i<currentInput.length?' filled':'')+(err?' err':'');
    ppDots.appendChild(d);
  }
}
function buildKeys(){
  ppKeys.innerHTML='';
  const layout=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  layout.forEach(k=>{
    const b=document.createElement('div');
    b.className='key'+(k===''?' ghost':'');
    b.textContent=k;
    if(k!==''){
      b.onclick=()=>onKey(k);
    }
    ppKeys.appendChild(b);
  });
}
function onKey(k){
  if(k==='⌫'){currentInput=currentInput.slice(0,-1);renderDots();return;}
  if(currentInput.length>=4)return;
  currentInput+=k;
  renderDots();
  if(currentInput.length===4){
    setTimeout(()=>handleComplete(),150);
  }
}
function handleComplete(){
  if(mode==='unlock'){
    if(currentInput===getPass()){
      openHome();
    }else{
      renderDots(true);
      setTimeout(()=>{currentInput='';renderDots();},380);
    }
  }else if(mode==='setnew'){
    pendingNew=currentInput;
    currentInput='';
    mode='confirmnew';
    ppLabel.textContent='再次输入以确认';
    renderDots();
  }else if(mode==='confirmnew'){
    if(currentInput===pendingNew){
      setPass(pendingNew);
      closePasspad();
      showSavedToast('密码已更新');
    }else{
      ppLabel.textContent='两次输入不一致,重新设置';
    }
    mode='setnew';
    currentInput='';
    pendingNew='';
    renderDots();
  }
}
function openPasspad(m){
  mode=m||'unlock';
  currentInput='';pendingNew='';
  ppLabel.textContent = mode==='unlock' ? '输入密码' : '设置新密码';
  renderDots();
  passpad.classList.add('show');
}
function closePasspad(){
  passpad.classList.remove('show');
  currentInput='';
}
document.getElementById('pp-cancel').onclick=closePasspad;
document.getElementById('swipeup').onclick=()=>openPasspad('unlock');
buildKeys();

function openHome(){
  closePasspad();
  lock.classList.add('hidden');
}
function relock(){
  lock.classList.remove('hidden');
  closeAllScreens();
}

/* swipe gesture on lock screen */
let touchStartY=null;
lock.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY;});
lock.addEventListener('touchend',e=>{
  if(touchStartY===null)return;
  const dy=touchStartY-e.changedTouches[0].clientY;
  if(dy>60)openPasspad('unlock');
  touchStartY=null;
});

/* ---------------- apps ---------------- */
const APPS=[
  {id:'settings',icon:'⚙️',label:'设置'},
  {id:'presets',icon:'📋',label:'预设'},
  {id:'offline',icon:'🖥️',label:'线下'},
  {id:'messages',icon:'💬',label:'消息'},
  {id:'twitter',icon:'🐦',label:'推特'},
  {id:'worldbook',icon:'📖',label:'世界书'},
  {id:'regex',icon:'✂️',label:'正则'},
  {id:'characters',icon:'🎭',label:'角色'},
];
const grid=document.getElementById('appgrid');
APPS.forEach(a=>{
  const el=document.createElement('div');
  el.className='app';
  el.innerHTML=`<div class="icon">${a.icon}</div><div class="label">${a.label}</div>`;
  el.onclick=()=>openScreen(a.id);
  grid.appendChild(el);
});

const screensRoot=document.getElementById('app-screens');
const builtScreens={};

function makePlaceholderScreen(title,emoji,note){
  const div=document.createElement('div');
  div.className='screen';
  div.innerHTML=`
    <header><span class="back">‹ 返回</span><h2>${title}</h2><span style="width:36px"></span></header>
    <div class="body"><div class="placeholder">
      <div class="big">${emoji}</div>
      <div class="t">${note}</div>
    </div></div>`;
  div.querySelector('.back').onclick=closeAllScreens;
  return div;
}

function makeSettingsScreen(){
  const cfg=loadJSON('ai-phone-settings',{
    llm:{baseUrl:'',apiKey:'',model:''},
    image:{provider:'novelai',apiKey:''},
    voice:{provider:'minimax',apiKey:''},
    persona:{name:''},
  });
  const div=document.createElement('div');
  div.className='screen';
  div.innerHTML=`
    <header><span class="back">‹ 返回</span><h2>设置</h2><span style="width:36px"></span></header>
    <div class="body">
      <fieldset>
        <legend>LLM API(OpenAI 格式)</legend>
        <label>Base URL</label>
        <input type="text" id="s-llm-url" placeholder="https://api.openai.com/v1">
        <label>API Key</label>
        <input type="password" id="s-llm-key" placeholder="sk-...">
        <label>模型名</label>
        <input type="text" id="s-llm-model" placeholder="gpt-4o / claude-... 等">
      </fieldset>
      <fieldset>
        <legend>你的人设(persona)</legend>
        <label>名字 · 对应宏 {{user}}</label>
        <input type="text" id="s-persona-name" placeholder="留空默认叫 User">
      </fieldset>
      <fieldset>
        <legend>生图 API</legend>
        <label>服务商</label>
        <select id="s-img-provider">
          <option value="novelai">NovelAI</option>
          <option value="gptimage">GPT-image</option>
        </select>
        <label>API Key</label>
        <input type="password" id="s-img-key" placeholder="API Key">
      </fieldset>
      <fieldset>
        <legend>语音生成 API</legend>
        <label>服务商</label>
        <select id="s-voice-provider">
          <option value="minimax">Minimax</option>
          <option value="elevenlabs">ElevenLabs</option>
        </select>
        <label>API Key</label>
        <input type="password" id="s-voice-key" placeholder="API Key">
      </fieldset>
      <fieldset>
        <legend>锁屏密码</legend>
        <button class="primary" id="s-changepass" style="background:var(--glass);color:var(--ink);border:1px solid var(--glass-border);">修改密码</button>
      </fieldset>
      <div class="savebar">
        <button class="primary" id="s-save">保存设置</button>
      </div>
      <div class="saved-msg" id="s-msg"></div>
    </div>`;
  div.querySelector('.back').onclick=closeAllScreens;
  div.querySelector('#s-llm-url').value=cfg.llm.baseUrl;
  div.querySelector('#s-llm-key').value=cfg.llm.apiKey;
  div.querySelector('#s-llm-model').value=cfg.llm.model;
  div.querySelector('#s-persona-name').value=(cfg.persona&&cfg.persona.name)||'';
  div.querySelector('#s-img-provider').value=cfg.image.provider;
  div.querySelector('#s-img-key').value=cfg.image.apiKey;
  div.querySelector('#s-voice-provider').value=cfg.voice.provider;
  div.querySelector('#s-voice-key').value=cfg.voice.apiKey;
  div.querySelector('#s-changepass').onclick=()=>openPasspad('setnew');
  div.querySelector('#s-save').onclick=()=>{
    const newCfg={
      llm:{
        baseUrl:div.querySelector('#s-llm-url').value.trim(),
        apiKey:div.querySelector('#s-llm-key').value.trim(),
        model:div.querySelector('#s-llm-model').value.trim(),
      },
      persona:{name:div.querySelector('#s-persona-name').value.trim()},
      image:{
        provider:div.querySelector('#s-img-provider').value,
        apiKey:div.querySelector('#s-img-key').value.trim(),
      },
      voice:{
        provider:div.querySelector('#s-voice-provider').value,
        apiKey:div.querySelector('#s-voice-key').value.trim(),
      },
    };
    saveJSON('ai-phone-settings',newCfg);
    const msg=div.querySelector('#s-msg');
    msg.textContent='已保存';
    setTimeout(()=>msg.textContent='',1600);
  };
  return div;
}

/* ---------------- macro engine (setvar/getvar) ---------------- */
function applyMacros(text,vars){
  vars=vars||loadJSON('ai-phone-vars',{});
  let changed=false;
  const out=text
    .replace(/{{setvar::([^:}]+)::([^}]*)}}/g,(m,k,v)=>{vars[k]=v;changed=true;return '';})
    .replace(/{{getvar::([^:}]+)}}/g,(m,k)=>(vars[k]!==undefined?vars[k]:''));
  if(changed)saveJSON('ai-phone-vars',vars);
  return out;
}
window.AIPhoneMacros={applyMacros};

/* ---------------- presets ---------------- */
function loadPresets(){return loadJSON('ai-phone-presets',[]);}
function savePresets(list){saveJSON('ai-phone-presets',list);}

function parseSillyTavernPreset(json,name){
  const prompts=json.prompts||[];
  const orderEntries=json.prompt_order||[];
  const orderEntry=orderEntries.reduce((best,cur)=>(cur.order&&(!best||cur.order.length>best.order.length))?cur:best,null);
  const order=orderEntry?orderEntry.order:prompts.map(p=>({identifier:p.identifier,enabled:p.enabled!==false}));
  const items=order.map(o=>{
    const p=prompts.find(pp=>pp.identifier===o.identifier)||{};
    return{
      identifier:o.identifier,
      name:p.name||o.identifier,
      role:p.role||'system',
      content:p.content||'',
      marker:!!p.marker,
      injPos:p.injection_position||0,injDepth:(p.injection_depth!=null?p.injection_depth:4),
      enabled:o.enabled!==false,
    };
  });
  return{id:'preset_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:name,type:'offline',items:items,_rawExtRegex:(json.extensions&&json.extensions.regex_scripts)||[]};
}

function makePresetsScreen(){
  const div=document.createElement('div');
  div.className='screen';
  div.innerHTML=`

/* ---------------- PNG chara chunk parsing ---------------- */
function bytesToBinaryString(bytes){
  let result='';
  const chunkSize=8192;
  for(let i=0;i<bytes.length;i+=chunkSize){
    result+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunkSize));
  }
  return result;
}
function parsePngTextChunks(buf){
  const bytes=new Uint8Array(buf);
  const dv=new DataView(buf);
  const result={};
  let i=8;
  while(i<bytes.length-8){
    const length=dv.getUint32(i);
    const type=String.fromCharCode(bytes[i+4],bytes[i+5],bytes[i+6],bytes[i+7]);
    if(type==='tEXt'){
      const chunkStart=i+8,chunkEnd=chunkStart+length;
      let nul=chunkStart;
      while(nul<chunkEnd&&bytes[nul]!==0)nul++;
      const keyword=bytesToBinaryString(bytes.slice(chunkStart,nul));
      const text=bytesToBinaryString(bytes.slice(nul+1,chunkEnd));
      result[keyword]=text;
    }
    if(type==='IEND')break;
    i+=8+length+4;
  }
  return result;
}
function base64ToJson(b64text){
  const bin=atob(b64text);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
function makeAvatarThumb(buf,mime){
  return new Promise(resolve=>{
    const blob=new Blob([buf],{type:mime||'image/png'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      const size=96;
      const canvas=document.createElement('canvas');
      canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d');
      const s=Math.max(size/img.width,size/img.height);
      const w=img.width*s,h=img.height*s;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve(null);};
    img.src=url;
  });
}

/* ---------------- offline chat ---------------- */
function getPersonaName(){const cfg=loadJSON('ai-phone-settings',{});return (cfg.persona&&cfg.persona.name)||'User';}
function normNL(t){return String(t==null?'':t).replace(/\r\n?/g,'\n');}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function applyAllMacros(text,charName,ch){
  ch=ch||{};
  const c=charName||'',u=getPersonaName();
  let t=applyMacros(normNL(text));
  t=t.replace(/{{\/\/[\s\S]*?}}/g,'').replace(/{{trim}}/gi,'').replace(/{{newline}}/gi,'\n')
     .replace(/{{random::([^}]*)}}/gi,(m,a)=>{const o=a.split('::');return o[Math.floor(Math.random()*o.length)];})
     .replace(/{{description}}/gi,()=>ch.description||'').replace(/{{personality}}/gi,()=>ch.personality||'')
     .replace(/{{scenario}}/gi,()=>ch.scenario||'').replace(/{{mesExamples}}/gi,()=>ch.mesExample||'');
  return t.replace(/{{char}}/gi,()=>c).replace(/{{user}}/gi,()=>u)
          .replace(/<char>/gi,()=>c).replace(/<bot>/gi,()=>c).replace(/<user>/gi,()=>u);
}
function toRegex(findStr){
  const m=/^\/([\s\S]*)\/([a-z]*)$/i.exec(findStr||'');
  try{
    if(m){let f=m[2];if(!f.includes('g'))f+='g';return new RegExp(m[1],f);}
    return findStr?new RegExp(findStr,'g'):null;
  }catch(e){return null;}
}
function collectActiveRegexScripts(charName,presetName,charId){
  const groups=loadRegexGroups();
  let scripts=[];
  groups.forEach(g=>{
    let ok=false;
    if(g.name==='默认分组'||g.name==='{{char}}')ok=true;            // 默认分组 / 旧版遗留分组
    else if(g.charId)ok=(g.charId===charId);                          // 角色卡导入的分组:只对该角色生效
    else if(g.name===charName||(presetName&&g.name===presetName))ok=true; // 预设分组:当前预设
    if(ok)scripts=scripts.concat((g.scripts||[]).filter(s=>s.enabled));
  });
  return scripts;
}
/* role: 'user'|'ai'; mode: 'display'(只影响显示) | 'prompt'(只影响发给模型);markdownOnly=仅显示,promptOnly=仅提示词,都不勾=全部 */
function applyRegexList(text,scripts,role,mode,ctx){
  let out=normNL(text);
  ctx=ctx||{};
  const cName=ctx.char||'',uName=ctx.user||'';
  const esc1=t=>t.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
  scripts.forEach(s=>{
    if(!(role==='user'?s.userTarget:s.aiTarget))return;
    if(mode==='display'&&s.promptOnly)return;
    if(mode==='prompt'&&s.markdownOnly)return;
    if(ctx.depth!=null){
      if(s.minDepth!=null&&ctx.depth<s.minDepth)return;
      if(s.maxDepth!=null&&ctx.depth>s.maxDepth)return;
    }
    const re=toRegex(String(s.find||'').replace(/{{char}}/gi,()=>esc1(cName)).replace(/{{user}}/gi,()=>esc1(uName)));
    if(!re)return;
    const rep=String(s.replace||'');
    try{
      // 用函数式替换:替换内容里的 $&、$' 等(HTML/JS 里很常见)不会被当成特殊占位符
      out=out.replace(re,(...a)=>{
        const gi=a.findIndex(x=>typeof x==='number');
        const groups=a.slice(0,gi);
        (s.trim||[]).forEach(t=>{if(t)groups[0]=groups[0].split(t).join('');});
        return rep.replace(/\$(\d{1,2})|{{match}}|{{char}}|{{user}}/gi,(m,n)=>
          n!==undefined?(groups[+n]!==undefined?groups[+n]:m):/match/i.test(m)?groups[0]:/char/i.test(m)?cName:uName);
      });
    }catch(e){}
  });
  return out;
}

/* ---- 富文本渲染:```html 围栏 / 整页 HTML / 块级 HTML → 沙盒 iframe(无 same-origin,读不到 localStorage 里的 API Key) ---- */
const BLOCK_HTML=/<(div|style|table|section|details|svg|center|h[1-6]|ul|ol|p|iframe)[\s>]/i;
function splitRich(t){
  const out=[],re=/```(\w*)[ \t]*\n([\s\S]*?)```/g;let last=0,m;
  while((m=re.exec(t))){
    if(m.index>last)out.push({k:'t',v:t.slice(last,m.index)});
    out.push(m[1].toLowerCase()==='html'||/^\s*(<!doctype|<html)/i.test(m[2])?{k:'h',v:m[2]}:{k:'c',v:m[2]});
    last=re.lastIndex;
  }
  if(last<t.length)out.push({k:'t',v:t.slice(last)});
  return out;
}
function htmlDoc(src){
  const hook='<script>(function(){var f=function(){parent.postMessage({aiphoneH:Math.ceil(document.documentElement.scrollHeight)},"*")};addEventListener("load",f);if(window.ResizeObserver)new ResizeObserver(f).observe(document.documentElement);setInterval(f,800)})()<\/script>';
  const full=/<html[\s>]|<!doctype/i.test(src);
  return (full?'':'<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;color:#f2f4f8;font-family:-apple-system,\'PingFang SC\',\'Microsoft YaHei\',sans-serif">')+src+hook;
}
window.addEventListener('message',e=>{
  if(!e.data||!e.data.aiphoneH)return;
  document.querySelectorAll('iframe.rich-frame').forEach(f=>{if(f.contentWindow===e.source)f.style.height=e.data.aiphoneH+'px';});
});
function renderRich(el,text){
  el.innerHTML='';
  const segs=splitRich(text);
  if(!segs.some(x=>x.k==='h'||(x.k==='t'&&BLOCK_HTML.test(x.v)))){el.textContent=text;return;}
  el.classList.add('rich');
  segs.forEach(x=>{
    if(x.k==='t'&&!BLOCK_HTML.test(x.v)){
      if(!x.v.trim())return;
      const d=document.createElement('div');d.style.cssText='padding:10px 12px;white-space:pre-wrap';d.textContent=x.v.trim();el.appendChild(d);return;
    }
    if(x.k==='c'){const pr=document.createElement('pre');pr.style.cssText='margin:0;padding:10px 12px;overflow-x:auto;font-size:12px';pr.textContent=x.v;el.appendChild(pr);return;}
    const f=document.createElement('iframe');
    f.className='rich-frame';f.setAttribute('sandbox','allow-scripts allow-popups');f.style.height='160px';f.srcdoc=htmlDoc(x.v);
    el.appendChild(f);
  });
}
function loadOfflineState(charId){return loadJSON('ai-phone-chat-'+charId,{presetId:null,messages:[]});}
function saveOfflineState(charId,state){saveJSON('ai-phone-chat-'+charId,state);}

function saveActiveCharId(id){saveJSON('ai-phone-active-char',id);}

const ERR_PREFIX='⚠️ 请求失败';

/* ---- 世界书激活:常驻 / 关键词(含 /正则/、次要关键词逻辑)/ 按 position 归位 / 角色卡内嵌书只对该角色生效 ---- */
function wiPos(p){return typeof p==='string'?(p==='after_char'?1:0):(p||0);}
function kwHit(keys,hay){
  return keys.some(k=>{
    k=String(k).trim();if(!k)return false;
    const m=/^\/([\s\S]+)\/([a-z]*)$/i.exec(k);
    try{return m?new RegExp(m[1],m[2]).test(hay):hay.toLowerCase().includes(k.toLowerCase());}catch(e){return false;}
  });
}
function activeWorldInfo(char,hay,scope){
  const out={before:[],after:[],depth:[]},hits=[];
  loadWorldbooks().forEach(wb=>{
    if(wb.fromCharacter&&char.worldbookId!==wb.id)return;
    wb.items.forEach(it=>{
      if(!it.enabled||!(it.scope==='all'||it.scope===scope)||!it.content)return;
      const keys=it.keys||(it.key?it.key.split(/\s*,\s*/):[]);
      let ok=!!it.constant||(keys.length>0&&kwHit(keys,hay));
      if(ok&&!it.constant&&it.selective&&(it.keys2||[]).length){
        const any=kwHit(it.keys2,hay),all=it.keys2.every(k=>kwHit([k],hay)),L=it.logic||0;
        ok=L===0?any:L===1?!all:L===2?!any:all;
      }
      if(ok)hits.push(it);
    });
  });
  hits.sort((a,b)=>(a.order||0)-(b.order||0)).forEach(it=>{
    const p=wiPos(it.position);
    if(p===4)out.depth.push({depth:it.depth!=null?it.depth:4,role:['system','user','assistant'][it.role||0]||'system',content:it.content});
    else if(p===0||p===5)out.before.push(it.content);else out.after.push(it.content);
  });
  return out;
}

/* 提示词组装顺序:预设条目(按预设顺序)里的 marker 占位 → 角色卡字段 / 世界书 / 聊天记录;没选预设则用默认顺序 */
function buildMessagesForAPI(char,state,scope){
  scope=scope||'offline';
  const preset=loadPresets().find(p=>p.id===state.presetId);
  const scripts=collectActiveRegexScripts(char.name,preset&&preset.name,char.id);
  const ctx={char:char.name,user:getPersonaName()};
  const mac=t=>applyAllMacros(t,char.name,char);
  const hist=[],n=state.messages.length;
  state.messages.forEach((m,i)=>{
    let text=m.swipes[m.swipeIndex]||'';
    const ei=text.indexOf(ERR_PREFIX);
    if(ei===0)return;                       // 纯报错消息不发给模型
    if(ei>0)text=text.slice(0,ei).trim();   // 带部分内容的报错,只保留正文
    const role=m.role==='ai'?'ai':'user';
    text=applyRegexList(text,scripts,role,'prompt',Object.assign({},ctx,{depth:n-1-i}));
    hist.push({role:role==='ai'?'assistant':'user',content:text});
  });
  const wi=activeWorldInfo(char,hist.slice(-4).map(h=>h.content).join('\n'),scope);
  const fill={worldInfoBefore:wi.before.join('\n'),worldInfoAfter:wi.after.join('\n'),charDescription:char.description,
    charPersonality:char.personality,scenario:char.scenario,dialogueExamples:char.mesExample};
  const order=preset?preset.items.filter(i=>i.enabled):[
    {identifier:'main',role:'system',content:char.systemPrompt||''},
    ...['worldInfoBefore','charDescription','charPersonality','scenario','worldInfoAfter','dialogueExamples','chatHistory'].map(id=>({marker:true,identifier:id})),
  ];
  const head=[],tail=[],inj=[];let afterHist=false;
  order.forEach(it=>{
    if(it.marker){
      if(it.identifier==='chatHistory'){afterHist=true;return;}
      const c=fill[it.identifier];
      if(c&&String(c).trim())(afterHist?tail:head).push({role:'system',content:mac(c)});
      return;
    }
    if(!it.content||!String(it.content).trim())return;
    const role=(it.role==='user'||it.role==='assistant')?it.role:'system';
    if(it.injPos===1){inj.push({depth:it.injDepth!=null?it.injDepth:4,role,content:mac(it.content)});return;}
    (afterHist?tail:head).push({role,content:mac(it.content)});
  });
  wi.depth.forEach(d=>inj.push({depth:d.depth,role:d.role,content:mac(d.content)}));
  if(char.postHistoryInstructions&&String(char.postHistoryInstructions).trim())tail.push({role:'system',content:mac(char.postHistoryInstructions)});
  const body=hist.slice();
  inj.sort((a,b)=>b.depth-a.depth).forEach(d=>body.splice(Math.max(0,body.length-d.depth),0,{role:d.role,content:d.content}));
  return head.concat(body,tail);
}

/* 流式请求(SSE);服务端不支持流式时自动退回普通请求。opts:{signal,onDelta(fullText)} */
async function callLLM(msgs,opts){
  opts=opts||{};
  const cfg=loadJSON('ai-phone-settings',{});
  if(!cfg.llm||!cfg.llm.baseUrl)throw new Error('还没在"设置"里填 LLM API 的 Base URL');
  const url=cfg.llm.baseUrl.replace(/\/$/,'')+'/chat/completions';
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+(cfg.llm.apiKey||'')};
  async function doFetch(stream){
    const body={model:cfg.llm.model,messages:msgs};
    if(stream)body.stream=true;
    return fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:opts.signal});
  }
  let res=await doFetch(true);
  if(!res.ok&&(res.status===400||res.status===422))res=await doFetch(false);
  if(!res.ok){
    let msg='HTTP '+res.status;
    try{const d=await res.json();msg=(d.error&&d.error.message)||d.message||msg;}catch(e){}
    throw new Error(msg);
  }
  const ct=res.headers.get('content-type')||'';
  if(!res.body||ct.indexOf('text/event-stream')<0){
    const data=await res.json();
    const text=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'';
    if(!text)throw new Error('接口返回里没有回复内容');
    if(opts.onDelta)opts.onDelta(text);
    return text;
  }
  const reader=res.body.getReader();
  const dec=new TextDecoder();
  let buf='',full='';
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).replace(/\r$/,'');
      buf=buf.slice(i+1);
      if(line.indexOf('data:')!==0)continue;
      const payload=line.slice(5).trim();
      if(!payload||payload==='[DONE]')continue;
      let j;
      try{j=JSON.parse(payload);}catch(e){continue;}
      if(j.error)throw new Error(j.error.message||JSON.stringify(j.error));
      const c=j.choices&&j.choices[0];
      const piece=c&&((c.delta&&c.delta.content)||(c.message&&c.message.content));
      if(piece){full+=piece;if(opts.onDelta)opts.onDelta(full);}
    }
  }
  if(!full)throw new Error('接口返回里没有回复内容');
  return full;
}

      const row=document.createElement('div');
      row.className='plist-item';row.style.cursor='pointer';
      row.innerHTML=`<div class="plist-head"><img class="avatar" src="${ch.avatar||''}"><div style="flex:1"><div class="nm">${esc(ch.name)}</div><div class="sub">点击开始对话</div></div></div>`;
      row.onclick=()=>openChat(ch);
      box.appendChild(row);
    });
  }

  function openChat(ch){
    inPicker=false;
    activeChar=ch;saveActiveCharId(ch.id);
    $('#of-title').textContent=ch.name;
    $('#of-charpick').style.display='none';
    $('#of-chat').style.display='block';
    $('#of-inputbar').style.display='flex';
    const state=loadOfflineState(ch.id);
    fillPresetBar(state);
    const dirty=state.messages.length===0?initGreeting(ch,state):mergeGreetings(ch,state);
    if(dirty)saveOfflineState(ch.id,state);
    updateSendBtn();
    renderMessages('bottom');
  }

  function fmtTs(t){const d=new Date(t);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
  function isPendingHere(){return !!(pending&&activeChar&&pending.charId===activeChar.id);}
  function updateSendBtn(){
    const b=$('#of-send');
    b.textContent=pending?'停止':'发送';
    b.style.background=pending?'var(--danger)':'';
    b.style.color=pending?'#fff':'';
  }
  function updatePendingStatus(){
    if(!isPendingHere())return;
    const st=$('#of-pstatus');if(!st)return;
    const sec=Math.floor((Date.now()-pending.startTs)/1000);
    const n=pending.text.length;
    st.textContent=n?`✍️ 生成中 · ${n} 字 · ${sec}s`:`⏳ 等待响应… ${sec}s`;
  }
  function updatePendingText(){
    if(!isPendingHere())return;
    const tx=$('#of-ptext');if(!tx)return;
    const chat=$('#of-chat');
    const near=chat.scrollHeight-chat.scrollTop-chat.clientHeight<140;
    tx.textContent=pending.text?applyRegexList(pending.text,pending.scripts,'ai','display',pending.ctx):'…';
    updatePendingStatus();
    if(near)chat.scrollTop=chat.scrollHeight;
  }
  function stopGeneration(){if(pending)pending.controller.abort();}

  /* scrollMode: 'bottom' | 'keep' | 'top' */
  function renderMessages(scrollMode){
    if(!activeChar)return;
    const state=loadOfflineState(activeChar.id);
    const chat=$('#of-chat');
    const prevScroll=chat.scrollTop;
    chat.style.display='block';
    chat.innerHTML='';
    const preset=loadPresets().find(p=>p.id===state.presetId);
    const scripts=collectActiveRegexScripts(activeChar.name,preset&&preset.name,activeChar.id);
    const ctx={char:activeChar.name,user:getPersonaName()};

    if(state.messages.length===0&&!isPendingHere()){
      const e=document.createElement('div');
      e.className='emptylist';
      e.innerHTML='还没有消息<br><br><span class="importbtn" style="display:inline-block;padding:10px 18px;margin:0" id="of-reinit">载入开场白</span>';
      e.querySelector('#of-reinit').onclick=()=>{
        const st=loadOfflineState(activeChar.id);
        if(initGreeting(activeChar,st)){saveOfflineState(activeChar.id,st);renderMessages('top');}
        else alert('这个角色没有开场白');
      };
      chat.appendChild(e);
    }

    const lastIdx=state.messages.length-1;
    state.messages.forEach((m,idx)=>{
      const isAI=m.role==='ai';
      const text=m.swipes[m.swipeIndex]||'';
      const isLastAI=isAI&&idx===lastIdx&&idx>0&&m.id!=='m0';
      const showNav=isAI&&(m.swipes.length>1||isLastAI);
      const bubble=document.createElement('div');
      bubble.className='chatmsg';
      bubble.innerHTML=`
        <div class="bubblehead">
          ${m.avatar?'<img class="avatar" style="width:26px;height:26px;border-radius:8px" src="'+m.avatar+'">':''}
          <span class="bname">${esc(m.name)}</span>
          <span class="bts">${fmtTs(m.ts)}</span>
        </div>
        <div class="bubblebox"><div class="bubbletext"></div>${showNav?`<div class="swipenav"><span class="arrow" data-sw="-1">‹</span><span class="pg">${m.swipeIndex+1}/${m.swipes.length}</span><span class="arrow" data-sw="1">›</span></div>`:''}</div>
        <div class="bubbletools">
          <span data-act="star">${m.starred?'★ 收藏':'☆ 收藏'}</span>
          <span data-act="edit">编辑</span>
          <span data-act="del">删除</span>
          ${isLastAI?'<span data-act="regen">重新生成</span>':''}
        </div>`;
      renderRich(bubble.querySelector('.bubbletext'),applyRegexList(text,scripts,isAI?'ai':'user','display',Object.assign({},ctx,{depth:lastIdx-idx})));

      bubble.querySelectorAll('[data-sw]').forEach(a=>{
        a.onclick=()=>{
          if(pending)return;
          const dir=parseInt(a.dataset.sw,10);
          const st=loadOfflineState(activeChar.id);
          const mm=st.messages[idx];
          if(!mm)return;
          const n=mm.swipes.length;
          if(dir>0&&mm.swipeIndex===n-1&&isLastAI){regenerate(idx);return;}
          mm.swipeIndex=(mm.swipeIndex+dir+n)%n;
          saveOfflineState(activeChar.id,st);
          renderMessages(idx===0?'top':'keep');
        };
      });
      bubble.querySelector('[data-act=star]').onclick=()=>{
        const st=loadOfflineState(activeChar.id);st.messages[idx].starred=!st.messages[idx].starred;
        saveOfflineState(activeChar.id,st);renderMessages('keep');
      };
      bubble.querySelector('[data-act=del]').onclick=()=>{
        if(pending)return;
        const st=loadOfflineState(activeChar.id);st.messages.splice(idx,1);
        saveOfflineState(activeChar.id,st);renderMessages('keep');
      };
      bubble.querySelector('[data-act=edit]').onclick=()=>{
        const ta=document.createElement('textarea');
        ta.value=text;
        ta.style.cssText='width:100%;min-height:120px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--ink);font-size:14px;line-height:1.6;padding:10px 12px;font-family:inherit;outline:none;';
        bubble.querySelector('.bubbletext').replaceWith(ta);
        ta.style.height=Math.min(ta.scrollHeight+4,420)+'px';
        ta.onblur=()=>{
          const st=loadOfflineState(activeChar.id);
          if(st.messages[idx]){
            st.messages[idx].swipes[st.messages[idx].swipeIndex]=ta.value;
            saveOfflineState(activeChar.id,st);
          }
          renderMessages('keep');
        };
        ta.focus();
      };
      const regenBtn=bubble.querySelector('[data-act=regen]');
      if(regenBtn)regenBtn.onclick=()=>regenerate(idx);
      chat.appendChild(bubble);
    });

    if(isPendingHere()){
      const pb=document.createElement('div');
      pb.className='chatmsg';
      pb.innerHTML=`
        <div class="bubblehead">
          ${activeChar.avatar?'<img class="avatar" style="width:26px;height:26px;border-radius:8px" src="'+activeChar.avatar+'">':''}
          <span class="bname">${esc(activeChar.name)}</span>
          <span class="bts" id="of-pstatus" style="color:var(--accent)"></span>
        </div>
        <div class="bubbletext" id="of-ptext">…</div>
        <div class="bubbletools"><span data-act="stop" style="color:var(--danger)">■ 停止生成</span></div>`;
      pb.querySelector('[data-act=stop]').onclick=stopGeneration;
      chat.appendChild(pb);
      updatePendingText();
    }

    if(scrollMode==='keep')chat.scrollTop=prevScroll;
    else if(scrollMode==='top')chat.scrollTop=0;
    else chat.scrollTop=chat.scrollHeight;
  }

  function finalText(r){
    if(r.errMsg){
      const hint=/Failed to fetch|NetworkError|Load failed/i.test(r.errMsg)?'(网络不通、被 CORS 拦截,或 Base URL 填错了)':'';
      return (r.text?r.text+'\n\n':'')+ERR_PREFIX+':'+r.errMsg+hint;
    }
    return r.text||null;
  }

  async function runGeneration(ch,msgs){
    const state=loadOfflineState(ch.id);
    const preset=loadPresets().find(p=>p.id===state.presetId);
    pending={
      charId:ch.id,controller:new AbortController(),text:'',startTs:Date.now(),
      scripts:collectActiveRegexScripts(ch.name,preset&&preset.name,ch.id),
      ctx:{char:ch.name,user:getPersonaName()},
    };
    pending.timer=setInterval(updatePendingStatus,500);
    updateSendBtn();
    renderMessages('bottom');
    let text='',errMsg=null;
    try{
      text=await callLLM(msgs,{
        signal:pending.controller.signal,
        onDelta:t=>{if(pending){pending.text=t;updatePendingText();}},
      });
    }catch(e){
      text=pending?pending.text:'';
      if(!(e&&e.name==='AbortError'))errMsg=(e&&e.message)||String(e);
    }
    clearInterval(pending.timer);
    pending=null;
    updateSendBtn();
    return{text:text||'',errMsg};
  }

  async function regenerate(idx){
    if(pending||!activeChar)return;
    const ch=activeChar;
    const state=loadOfflineState(ch.id);
    if(!state.messages[idx])return;
    const msgs=buildMessagesForAPI(ch,{presetId:state.presetId,messages:state.messages.slice(0,idx)});
    const r=await runGeneration(ch,msgs);
    const out=finalText(r);
    const st=loadOfflineState(ch.id);
    const mm=st.messages[idx];
    if(mm&&out!==null){mm.swipes.push(out);mm.swipeIndex=mm.swipes.length-1;saveOfflineState(ch.id,st);}
    if(activeChar&&activeChar.id===ch.id)renderMessages('bottom');
  }

  async function sendMessage(text){
    if(pending||!activeChar)return;
    const ch=activeChar;
    const state=loadOfflineState(ch.id);
    state.messages.push({id:'m_'+Date.now(),role:'user',name:getPersonaName(),ts:Date.now(),swipes:[text],swipeIndex:0,starred:false});
    saveOfflineState(ch.id,state);
    const msgs=buildMessagesForAPI(ch,state);
    const r=await runGeneration(ch,msgs);
    const out=finalText(r);
    const st=loadOfflineState(ch.id);
    if(out!==null){
      st.messages.push({id:'m_'+Date.now()+'a',role:'ai',name:ch.name,avatar:ch.avatar,ts:Date.now(),swipes:[out],swipeIndex:0,starred:false});
    }
    saveOfflineState(ch.id,st);
    if(activeChar&&activeChar.id===ch.id)renderMessages('bottom');
  }

  const inputEl=$('#of-input');
  function autosize(){inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,140)+'px';}
  inputEl.addEventListener('input',autosize);
  inputEl.addEventListener('keydown',(e)=>{
    // 电脑:Enter 发送,Shift+Enter 换行;手机:Enter 就是换行,用右边按钮发送
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!window.matchMedia('(pointer:coarse)').matches){
      e.preventDefault();$('#of-send').click();
    }
  });
  $('#of-switch').onclick=showCharPicker;
  $('#of-send').onclick=()=>{
    if(pending){stopGeneration();return;}
    const text=inputEl.value.trim();
    if(!text||!activeChar)return;
    inputEl.value='';autosize();
    sendMessage(text);
  };

  div._refresh=()=>{
    if(!inPicker&&activeChar){
      const c=loadCharacters().find(x=>x.id===activeChar.id);
      if(c){activeChar=c;renderMessages('keep');return;}
      activeChar=null;
    }
    showCharPicker();
  };

  const lastCharId=loadActiveCharId();
  const lastChar=lastCharId&&loadCharacters().find(c=>c.id===lastCharId);
  if(lastChar)openChat(lastChar);else showCharPicker();
  return div;
}

function buildScreen(id){
  switch(id){
    case 'settings': return makeSettingsScreen();
    case 'presets': return makePresetsScreen();
    case 'offline': return makeOfflineScreen();
    case 'messages': return makePlaceholderScreen('消息','💬','模拟微信式与 AI 角色 / 群聊 的消息 + 朋友圈交互。下一步开发。');
    case 'twitter': return makePlaceholderScreen('推特','🐦','模拟与 AI 角色的社媒动态交互。下一步开发。');
    case 'worldbook': return makeWorldbookScreen();
    case 'regex': return makeRegexScreen();
    case 'characters': return makeCharactersScreen();
  }
}
function openScreen(id){
  if(!builtScreens[id]){
    builtScreens[id]=buildScreen(id);
    screensRoot.appendChild(builtScreens[id]);
  }else if(builtScreens[id]._refresh){
    try{builtScreens[id]._refresh();}catch(e){}
  }
  requestAnimationFrame(()=>builtScreens[id].classList.add('show'));
}
function closeAllScreens(){
  Object.values(builtScreens).forEach(s=>s.classList.remove('show'));
}
function showSavedToast(t){
  // reuse settings msg if open, else ignore
}

/* ---------------- PWA: service worker registration ---------------- */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{/* not hosted here yet, ignore */});
  });
}

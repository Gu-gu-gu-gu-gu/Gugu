<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Phone</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Phone">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg-deep:#0a0e1a; --bg-mid:#161b2e; --wallpaper-a:#1a2140; --wallpaper-b:#3a2e5c;
  --accent:#8fe3d4; --accent-dim:#4f7d75;
  --ink:#f2f4f8; --ink-dim:#9aa3b8; --ink-faint:#5c6480;
  --glass:rgba(255,255,255,0.08); --glass-border:rgba(255,255,255,0.14);
  --danger:#e37878;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg-deep);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#frame{
  position:relative;
  width:100%;max-width:420px;height:100%;max-height:900px;
  background:linear-gradient(160deg,var(--wallpaper-a),var(--wallpaper-b) 70%);
  border-radius:0px;overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,0.5);
}
@media (min-width:480px) and (min-height:760px){
  #frame{border-radius:44px;border:8px solid #05060a;height:860px;}
}
/* ---------- status bar ---------- */
/* ---------- lock screen ---------- */
#lock{
  position:absolute;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;
  padding-top:14%;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;
  touch-action:none;
}
#lock.hidden{transform:translateY(-100%);opacity:0;pointer-events:none;}
#lock .time{font-size:74px;font-weight:200;line-height:1;letter-spacing:-1px;}
#lock .date{font-size:15px;color:var(--ink-dim);margin-top:8px;}
#lock .hint{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  left:0;right:0;text-align:center;font-size:13px;color:var(--ink-dim);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:pulse 2.4s ease-in-out infinite;
  cursor:pointer;user-select:none;
}
#lock .hint .bar{width:120px;height:4px;border-radius:3px;background:var(--ink-dim);opacity:.6;}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

#passpad{
  position:absolute;inset:0;z-index:41;background:rgba(10,14,26,0.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
}
#passpad.show{transform:translateY(0);}
#passpad .label{font-size:14px;color:var(--ink-dim);}
#passpad .dots{display:flex;gap:16px;}
#passpad .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink-dim);}
#passpad .dot.filled{background:var(--ink);border-color:var(--ink);}
#passpad .dot.err{background:var(--danger);border-color:var(--danger);}
#passpad .keys{display:grid;grid-template-columns:repeat(3,64px);gap:16px;}
#passpad .key{
  width:64px;height:64px;border-radius:50%;background:var(--glass);
  border:1px solid var(--glass-border);color:var(--ink);font-size:22px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
#passpad .key:active{background:rgba(255,255,255,0.2);}
#passpad .key.ghost{background:transparent;border:none;}
#passpad .backbtn{margin-top:6px;font-size:13px;color:var(--ink-dim);cursor:pointer;}

/* ---------- home screen ---------- */
#home{position:absolute;inset:0;z-index:10;padding:0 22px;padding-top:calc(env(safe-area-inset-top,0px) + 28px);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px;}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.app .icon{
  width:58px;height:58px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(6px);
}
.app .label{font-size:11.5px;color:var(--ink);text-align:center;}
.app:active .icon{transform:scale(0.92);}

/* ---------- app screens ---------- */
.screen{
  position:absolute;inset:0;z-index:30;background:var(--bg-mid);
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
}
.screen.show{transform:translateY(0);}
.screen header{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px;
  border-bottom:1px solid var(--glass-border);
  flex:0 0 auto;
}
.screen header .back{cursor:pointer;color:var(--accent);font-size:15px;}
.screen header h2{font-size:17px;font-weight:600;margin:0;flex:1;}
.screen .body{flex:1;overflow-y:auto;padding:18px;}

.placeholder{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--ink-faint);text-align:center;padding:0 30px;
}
.placeholder .big{font-size:32px;}
.placeholder .t{font-size:14px;color:var(--ink-dim);}

/* ---------- settings form ---------- */
fieldset{border:1px solid var(--glass-border);border-radius:12px;padding:14px;margin-bottom:16px;}
legend{font-size:13px;color:var(--accent);padding:0 6px;}
label{display:block;font-size:12.5px;color:var(--ink-dim);margin:10px 0 5px;}
input[type=text],input[type=password],select{
  width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.05);color:var(--ink);font-size:14px;outline:none;
}
input:focus,select:focus{border-color:var(--accent);}
.savebar{
  position:sticky;bottom:0;display:flex;gap:10px;padding-top:6px;
}
button.primary{
  flex:1;padding:12px;border-radius:10px;border:none;background:var(--accent);
  color:#0a2420;font-weight:600;font-size:14.5px;cursor:pointer;
}
button.primary:active{opacity:.85;}
button.mini{padding:8px 12px;border-radius:9px;border:1px solid var(--glass-border);background:var(--glass);color:var(--ink);font-size:13px;cursor:pointer;flex:1}
button.mini:active{opacity:.7}button.mini.danger{color:var(--danger,#ff6b6b)}
input[type=number],input[type=datetime-local]{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--ink);font-size:14px;outline:none;color-scheme:dark}
#s-mlist option{padding:6px 4px}
.saved-msg{font-size:12.5px;color:var(--accent);text-align:center;height:16px;margin-top:8px;}

.importbtn{display:block;text-align:center;padding:12px;border-radius:10px;border:1px dashed var(--glass-border);color:var(--accent);font-size:13.5px;cursor:pointer;margin-bottom:16px;}
.emptylist{color:var(--ink-faint);font-size:13px;text-align:center;padding:30px 0;}
.plist-item{border:1px solid var(--glass-border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.plist-head{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;}
.plist-head .nm{font-size:14px;}
.plist-head .sub{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.plist-body{display:none;padding:0 12px 10px;}
.plist-body.open{display:block;}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,0.06);}
.prow .pname{flex:1;font-size:12.5px;cursor:pointer;}
.prow textarea{width:100%;min-height:80px;margin-top:6px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:8px;color:var(--ink);font-size:12px;padding:8px;flex-basis:100%;}
.toggle{width:38px;height:22px;border-radius:12px;background:var(--glass-border);position:relative;cursor:pointer;flex:0 0 auto;}
.toggle.on{background:var(--accent);}
.toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle.on .knob{left:18px;}
.scopebtn{font-size:11px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:8px;padding:3px 8px;cursor:pointer;flex:0 0 auto;}
.inlinebox{margin-bottom:16px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:12px;}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px;}
.chip{font-size:11px;padding:4px 9px;border-radius:8px;border:1px solid var(--glass-border);color:var(--ink-dim);cursor:pointer;}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(143,227,212,0.1);}
.avatar{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--glass);}
.plist-body textarea[readonly]{width:100%;min-height:60px;margin:6px 0 10px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:8px;color:var(--ink);font-size:12px;padding:8px;}
.chatmsg{margin-bottom:16px;}
.bubblehead{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.bubblehead .bname{font-size:13px;font-weight:600;}
.bubblehead .bts{font-size:10.5px;color:var(--ink-faint);}
.bubbletext{font-size:14px;line-height:1.6;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:10px 12px;white-space:pre-wrap;}
.bubbletools{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--ink-faint);}
.bubbletools span{cursor:pointer;}
.bubbletools span:hover{color:var(--accent);}
.bubbletools{align-items:center;}
.swipenav{display:flex;align-items:center;gap:2px;margin-left:auto;color:var(--accent);}
.swipenav .arrow{padding:2px 10px;font-size:20px;line-height:1;user-select:none;}
.swipenav .pg{min-width:34px;text-align:center;color:var(--ink-dim);font-size:12px;}
#of-inputbar{align-items:flex-end;}
#of-input{flex:1;width:auto;margin:0;min-height:42px;max-height:140px;resize:none;padding:10px 11px;border-radius:9px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--ink);font-size:14px;line-height:1.5;font-family:inherit;outline:none;overflow-y:auto;}
#of-input:focus{border-color:var(--accent);}
.bubblebox{background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;overflow:hidden}
.bubblebox .bubbletext{background:none;border:0;border-radius:0}
.bubblebox .bubbletext.rich{padding:0;white-space:normal}
.bubblebox .swipenav{display:flex;justify-content:flex-end;margin:0;padding:0 8px 6px}
.rich-frame{width:100%;border:0;display:block;background:transparent}
.md{white-space:normal}.bubbletext.md{white-space:normal}
.cot{border-bottom:1px solid var(--glass-border);font-size:12px;color:var(--ink-faint)}.cot summary{cursor:pointer;padding:7px 12px;user-select:none}.cotbody{padding:0 12px 10px;white-space:pre-wrap;line-height:1.5}
.md p{margin:0 0 8px}.md p:last-child{margin:0}.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:6px 0;font-size:1.1em}
.md blockquote{margin:6px 0;padding:2px 10px;border-left:3px solid var(--accent-dim);color:var(--ink-dim)}
.md pre{background:rgba(0,0,0,.3);padding:8px;border-radius:8px;overflow-x:auto;white-space:pre;margin:6px 0}
.md code{background:rgba(0,0,0,.25);padding:1px 4px;border-radius:4px;font-size:.92em}.md pre code{background:none;padding:0}
.md ul,.md ol{margin:4px 0;padding-left:20px}.md hr{border:0;border-top:1px solid var(--glass-border)}.md a{color:var(--accent)}
.wxf{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--glass-border);background:rgba(255,255,255,.05);color:var(--ink);font-size:14px;font-family:inherit;outline:none}
.wxtabs{display:flex;border-top:1px solid var(--glass-border);padding-bottom:env(safe-area-inset-bottom,0px);flex:0 0 auto}
.wxtab{flex:1;text-align:center;padding:9px 0 7px;font-size:11px;color:var(--ink-dim);cursor:pointer}.wxtab i{display:block;font-style:normal;font-size:20px}.wxtab.on{color:var(--accent)}
.wxrow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.wxrow .avatar{width:44px;height:44px}.wxrow .l1{font-size:15px}.wxrow .l2{font-size:12.5px;color:var(--ink-faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.wxchat{position:absolute;inset:0;z-index:5;background:var(--bg-mid);display:none;flex-direction:column}
.wxmsgs{flex:1;overflow-y:auto;padding:14px}.wxm{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start}.wxm.me{flex-direction:row-reverse}
.wxm .avatar{width:38px;height:38px;border-radius:8px}.wxb{max-width:68%;padding:9px 12px;border-radius:8px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--glass);border:1px solid var(--glass-border)}
.wxm.me .wxb{background:var(--accent);color:#0a2420;border-color:transparent}
.wxsys{text-align:center;font-size:11.5px;color:var(--ink-faint);margin:6px 0 12px}
</style>
</head>
<body>
<div id="frame">
  <div id="home">
    <div class="grid" id="appgrid"></div>
  </div>

  <div id="lock">
    <div class="time" id="lock-time">--:--</div>
    <div class="date" id="lock-date"></div>
    <div class="hint" id="swipeup">
      <div class="bar"></div>
      向上滑动解锁
    </div>
  </div>

  <div id="passpad">
    <div class="label" id="pp-label">输入密码</div>
    <div class="dots" id="pp-dots"></div>
    <div class="keys" id="pp-keys"></div>
    <div class="backbtn" id="pp-cancel">取消</div>
  </div>

  <div id="app-screens"></div>
</div>

<script>
/* ---------------- clock ---------------- */
function fmtTime(d){return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function fmtDate(d){
  const w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+w;
}
function tick(){
  const d=new Date();
  document.getElementById('lock-time').textContent=fmtTime(d);
  document.getElementById('lock-date').textContent=fmtDate(d);
}
tick(); setInterval(tick,1000*10);

/* ---------------- storage helpers ---------------- */
function loadJSON(key,fallback){
  try{const v=localStorage.getItem(key); return v?JSON.parse(v):fallback;}catch(e){return fallback;}
}
function saveJSON(key,val){
  try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}
}


/* ---------------- 时间注入 / 历史轮数 ---------------- */
const WEEK_CN=['周日','周一','周二','周三','周四','周五','周六'];
function loadTimeCfg(){const c=(loadJSON('ai-phone-settings',{})||{}).time||{};return Object.assign({mode:'real',virtualBase:0,realAtSet:0},c);}
function getEffectiveNow(forceReal){ // 返回 Date;virtual 模式 = 设定的虚拟时刻 + 之后真实流逝
  const t=loadTimeCfg();
  if(!forceReal&&t.mode==='virtual'&&t.virtualBase)return new Date(t.virtualBase+(Date.now()-t.realAtSet));
  return new Date();
}
function toLocalInput(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function fmtFullTime(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+WEEK_CN[d.getDay()]+' '+p(d.getHours())+':'+p(d.getMinutes());}
function timeText(){const t=loadTimeCfg();if(t.mode==='off')return '';return '[当前时间:'+fmtFullTime(getEffectiveNow())+']';}
function ctxRounds(scope){const c=(loadJSON('ai-phone-settings',{})||{}).ctx||{};const v=c[scope];return v==null?(scope==='online'?20:0):Math.max(0,parseInt(v)||0);}
function limitRounds(msgs,n){ // 一轮 = 一条用户消息及其后的回复;n<=0 不限制
  if(!n||n<=0)return msgs;
  let cnt=0;
  for(let i=msgs.length-1;i>=0;i--){if(msgs[i].role!=='ai'){cnt++;if(cnt===n)return msgs.slice(i);}}
  return msgs;
}

/* ---------------- lock / passcode ---------------- */
const lock=document.getElementById('lock');
const passpad=document.getElementById('passpad');
const ppDots=document.getElementById('pp-dots');
const ppKeys=document.getElementById('pp-keys');
const ppLabel=document.getElementById('pp-label');
let currentInput='';
let mode='unlock'; // unlock | setnew | confirmnew
let pendingNew='';

function getPass(){return loadJSON('ai-phone-pass','0000');}
function setPass(p){saveJSON('ai-phone-pass',p);}

function renderDots(err){
  ppDots.innerHTML='';
  for(let i=0;i<4;i++){
    const d=document.createElement('div');
    d.className='dot'+(i<currentInput.length?' filled':'')+(err?' err':'');
    ppDots.appendChild(d);
  }
}
function buildKeys(){
  ppKeys.innerHTML='';
  const layout=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  layout.forEach(k=>{
    const b=document.createElement('div');
    b.className='key'+(k===''?' ghost':'');
    b.textContent=k;
    if(k!==''){
      b.onclick=()=>onKey(k);
    }
    ppKeys.appendChild(b);
  });
}
function onKey(k){
  if(k==='⌫'){currentInput=currentInput.slice(0,-1);renderDots();return;}
  if(currentInput.length>=4)return;
  currentInput+=k;
  renderDots();
  if(currentInput.length===4){
    setTimeout(()=>handleComplete(),150);
  }
}
function handleComplete(){
  if(mode==='unlock'){
    if(currentInput===getPass()){
      openHome();
    }else{
      renderDots(true);
      setTimeout(()=>{currentInput='';renderDots();},380);
    }
  }else if(mode==='setnew'){
    pendingNew=currentInput;
    currentInput='';
    mode='confirmnew';
    ppLabel.textContent='再次输入以确认';
    renderDots();
  }else if(mode==='confirmnew'){
    if(currentInput===pendingNew){
      setPass(pendingNew);
      closePasspad();
      showSavedToast('密码已更新');
    }else{
      ppLabel.textContent='两次输入不一致,重新设置';
    }
    mode='setnew';
    currentInput='';
    pendingNew='';
    renderDots();
  }
}
function openPasspad(m){
  mode=m||'unlock';
  currentInput='';pendingNew='';
  ppLabel.textContent = mode==='unlock' ? '输入密码' : '设置新密码';
  renderDots();
  passpad.classList.add('show');
}
function closePasspad(){
  passpad.classList.remove('show');
  currentInput='';
}
document.getElementById('pp-cancel').onclick=closePasspad;
document.getElementById('swipeup').onclick=()=>openPasspad('unlock');
buildKeys();

function openHome(){
  closePasspad();
  lock.classList.add('hidden');
}
function relock(){
  lock.classList.remove('hidden');
  closeAllScreens();
}

/* swipe gesture on lock screen */
let touchStartY=null;
lock.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY;});
lock.addEventListener('touchend',e=>{
  if(touchStartY===null)return;
  const dy=touchStartY-e.changedTouches[0].clientY;
  if(dy>60)openPasspad('unlock');
  touchStartY=null;
});

/* ---------------- apps ---------------- */
const APPS=[
  {id:'settings',icon:'⚙️',label:'设置'},
  {id:'presets',icon:'📋',label:'预设'},
  {id:'offline',icon:'🖥️',label:'线下'},
  {id:'messages',icon:'💬',label:'消息'},
  {id:'twitter',icon:'🐦',label:'推特'},
  {id:'worldbook',icon:'📖',label:'世界书'},
  {id:'regex',icon:'✂️',label:'正则'},
  {id:'characters',icon:'🎭',label:'角色'},
];
const grid=document.getElementById('appgrid');
APPS.forEach(a=>{
  const el=document.createElement('div');
  el.className='app';
  el.innerHTML=`<div class="icon">${a.icon}</div><div class="label">${a.label}</div>`;
  el.onclick=()=>openScreen(a.id);
  grid.appendChild(el);
});

const screensRoot=document.getElementById('app-screens');
const builtScreens={};

function makePlaceholderScreen(title,emoji,note){
  const div=document.createElement('div');
  div.className='screen';
  div.innerHTML=`
    <header><span class="back">‹ 返回</span><h2>${title}</h2><span style="width:36px"></span></header>
    <div class="body"><div class="placeholder">
      <div class="big">${emoji}</div>
      <div class="t">${note}</div>
    </div></div>`;
  div.querySelector('.back').onclick=closeAllScreens;
  return div;
}

function makeSettingsScreen(){
  const cfg=loadJSON('ai-phone-settings',{
    llm:{baseUrl:'',apiKey:'',model:''},
    image:{provider:'novelai',apiKey:''},
    voice:{provider:'minimax',apiKey:''},
    persona:{name:''},
  });
  cfg.llm=cfg.llm||{baseUrl:'',apiKey:'',model:''};cfg.image=cfg.image||{provider:'novelai',apiKey:''};cfg.voice=cfg.voice||{provider:'minimax',apiKey:''};

function applyMacros(text,vars){

    .replace(/{{getvar::([^:}]+)}}/g,(m,k)=>(vars[k]!==undefined?vars[k]:''));

}

/* 长按(380ms)后拖动排序;长按前移动超过 8px 视为滚动,不触发 */
function longPressDrag(rows,onDrop){
  rows.forEach((row,from)=>{
    let t=null,sx=0,sy=0,on=false,rects=[],to=from;
    const reset=()=>{rows.forEach(r=>{r.style.transform='';r.style.transition='';r.style.zIndex='';r.style.opacity='';r.style.background='';});on=false;};
    row.addEventListener('contextmenu',e=>e.preventDefault());
    row.addEventListener('touchmove',e=>{if(on&&e.cancelable)e.preventDefault();},{passive:false});
    row.addEventListener('pointerdown',e=>{
      if(e.target.closest('.toggle,input,select,textarea,.f-s,.f-x'))return;
      sx=e.clientX;sy=e.clientY;const pid=e.pointerId;
      t=setTimeout(()=>{t=null;on=true;to=from;rects=rows.map(r=>r.getBoundingClientRect());
        try{row.setPointerCapture(pid);}catch(_){}
        row.style.zIndex=5;row.style.opacity='.85';row.style.background='var(--glass)';row.style.userSelect='none';
        rows.forEach(r=>{if(r!==row)r.style.transition='transform .15s';});
        if(navigator.vibrate)navigator.vibrate(15);},380);
    });
    row.addEventListener('pointermove',e=>{
      if(!on){if(t&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)){clearTimeout(t);t=null;}return;}
      const dy=e.clientY-sy,h=rects[from].height,c=rects[from].top+h/2+dy;
      row.style.transform='translateY('+dy+'px)';
      to=rects.reduce((b,r,k)=>Math.abs(r.top+r.height/2-c)<Math.abs(rects[b].top+rects[b].height/2-c)?k:b,from);
      rows.forEach((r,k)=>{if(k===from)return;r.style.transform=(from<to&&k>from&&k<=to)?'translateY('+(-h)+'px)':(from>to&&k<from&&k>=to)?'translateY('+h+'px)':'';});
    });
    const end=e=>{clearTimeout(t);t=null;if(!on)return;const d=to;reset();if(d!==from&&e.type==='pointerup')onDrop(from,d);};
    row.addEventListener('pointerup',end);row.addEventListener('pointercancel',end);
  });
}
/* 思维链/正文标签:原文照存,显示时拆分;注入提示词时去掉思维链 */
function loadCot(){return Object.assign({thinkOpen:'<think>',thinkClose:'</think>',bodyOpen:'<content>',bodyClose:'</content>'},loadJSON('ai-phone-cot',{}));}
function splitCot(text,cfg){
  cfg=cfg||loadCot();let rest=text||'',body='';const to=cfg.thinkOpen,tc=cfg.thinkClose,ts=[];
  if(!to||!tc)return{think:'',body:rest};
  for(;;){
    const a=rest.indexOf(to);if(a<0){body+=rest;break;}
    body+=rest.slice(0,a);const b=rest.indexOf(tc,a+to.length);
    if(b<0){ts.push(rest.slice(a+to.length));break;} // 流式中,思维链还没写完
    ts.push(rest.slice(a+to.length,b));rest=rest.slice(b+tc.length);
  }
  return{think:ts.join('\n\n').trim(),body:body.trim()};
}
function extractBody(t,cfg){
  cfg=cfg||loadCot();if(!cfg.bodyOpen||!cfg.bodyClose)return t;
  const a=t.indexOf(cfg.bodyOpen);if(a<0)return t;
  const b=t.indexOf(cfg.bodyClose,a+cfg.bodyOpen.length);
  return(b<0?t.slice(a+cfg.bodyOpen.length):t.slice(a+cfg.bodyOpen.length,b)).trim();
}

function parseSillyTavernPreset(json,name){
  const prompts=json.prompts||[];
  const orderEntries=json.prompt_order||[];
  const orderEntry=orderEntries.reduce((best,cur)=>(cur.order&&(!best||cur.order.length>best.order.length))?cur:best,null);
  const order=orderEntry?orderEntry.order:prompts.map(p=>({identifier:p.identifier,enabled:p.enabled!==false}));
  const items=order.map(o=>{
    const p=prompts.find(pp=>pp.identifier===o.identifier)||{};
    return{
      identifier:o.identifier,
      name:p.name||o.identifier,
      role:p.role||'system',
      content:p.content||'',
      marker:!!p.marker,
      injPos:p.injection_position||0,injDepth:(p.injection_depth!=null?p.injection_depth:4),
      enabled:o.enabled!==false,scope:p.scope||'all',
    };
  });
  return{id:'preset_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:name,type:'offline',items:items,_rawExtRegex:(json.extensions&&json.extensions.regex_scripts)||[]};
}

        const name=f.name.replace(/\.json$/i,'');
        const preset=parseSillyTavernPreset(json,name);
        const list=loadPresets();
        list.push(preset);
        savePresets(list);
        renderList();
      }catch(e){
        alert('解析失败,不是有效的预设 json');
      }
    };

    fileInput.value='';
  };
  let defOpen=false;
  function renderDefault(box){
    const act=loadJSON('ai-phone-active-preset',null),p=getDefaultPreset();
    const saveDef=()=>saveJSON('ai-phone-default-preset',{order:p.items.map(i=>i.identifier),custom:p.items.filter(i=>!i.locked)});

    const sh=document.createElement('div');sh.className='plist-item';
    const on=loadJSON('ai-phone-share-history',true);
    sh.innerHTML=`<div class="plist-head"><div style="flex:1"><div class="nm">线上 / 线下历史互通</div><div class="sub">开启后,另一边最近 30 条消息按时间混入聊天历史</div></div><div class="toggle${on?' on':''}"><div class="knob"></div></div></div>`;

    const body=item.querySelector('.plist-body');
    const mv=(i,d)=>{const j=i+d;if(j<0||j>=p.items.length)return;[p.items[i],p.items[j]]=[p.items[j],p.items[i]];persist();};
    p.items.forEach((it,i)=>{

      row.innerHTML=`<div class="pname" style="cursor:pointer">${it.locked?'🔒 ':''}${esc(it.name)}${it.locked?'':`<span style="color:var(--ink-faint)"> · ${it.role} · ${SCOPE_LABEL[it.scope||'all']}</span>`}</div><span style="color:var(--ink-faint);padding:0 6px">≡</span>${it.locked?'':`<div class="toggle${it.enabled!==false?' on':''}"><div class="knob"></div></div>`}`;

      row.querySelector('.toggle').onclick=e=>{it.enabled=it.enabled===false;saveDef();e.currentTarget.classList.toggle('on',it.enabled);};

      q('.f-n').onchange=e=>{it.name=e.target.value||'未命名';persist();};
      q('.f-r').onchange=e=>{it.role=e.target.value;persist();};
      q('.f-d').onchange=e=>{const v=e.target.value;it.injPos=v===''?0:1;it.injDepth=+v||0;saveDef();};
      q('.f-c').onblur=e=>{it.content=e.target.value;saveDef();};
      q('.f-s').onclick=()=>{it.scope=nextScope(it.scope||'all');persist();};

    const add=document.createElement('div');add.className='importbtn';add.textContent='+ 新增条目';
    add.onclick=()=>{const k=p.items.findIndex(x=>x.identifier==='chatHistory');p.items.splice(k<0?p.items.length:k,0,{identifier:'c_'+Date.now(),name:'新条目',role:'system',content:'',scope:'all',enabled:true,injPos:0,injDepth:4});defOpen=true;persist();};
    body.appendChild(add);
    item.querySelector('.plist-head').onclick=e=>{if(e.target.closest('[data-use],[data-exp]'))return;defOpen=!defOpen;body.classList.toggle('open',defOpen);};
    item.querySelector('[data-exp]').onclick=e=>{e.stopPropagation();downloadJSON('默认预设',presetToJSON(p));};
    const u=item.querySelector('[data-use]');if(u)u.onclick=e=>{e.stopPropagation();saveJSON('ai-phone-active-preset',null);renderList();};
    box.appendChild(item);
  }
  function renderList(){
    const list=loadPresets();
    const box=div.querySelector('#p-list');
    box.innerHTML='';
    renderDefault(box);
    list.forEach(preset=>{
      const item=document.createElement('div');
      item.className='plist-item';
      const enabledCount=preset.items.filter(i=>i.enabled&&!i.marker).length;
      item.innerHTML=`

          <div style="flex:1">
            <div class="nm">${preset.name}</div>
            <div class="sub">${loadJSON('ai-phone-active-preset',null)===preset.id?'✅ 使用中 · ':''}${preset.items.length} 条(${enabledCount} 启用) · 点击展开</div>
          </div>
          <div class="toggle${loadJSON('ai-phone-active-preset',null)===preset.id?' on':''}" data-act="use" style="margin-right:10px"><div class="knob"></div></div><span style="color:var(--accent);font-size:12px;cursor:pointer;margin-right:10px" data-exp>导出</span><span style="color:var(--danger);font-size:12px;cursor:pointer" data-del="${preset.id}">删除</span>
        </div>
        <div class="plist-body"></div>`;
      item.querySelector('[data-exp]').onclick=e=>{e.stopPropagation();downloadJSON(preset.name,presetToJSON(preset));};
      const body=item.querySelector('.plist-body');
      preset.items.forEach((it,idx)=>{
        if(it.marker)return;
        const row=document.createElement('div');
        row.className='prow';
        row.style.flexWrap='wrap';
        row.innerHTML=`
          <div class="pname">${it.name}<span style="color:var(--ink-faint)"> · ${it.role}</span></div>
          <div class="toggle${it.enabled?' on':''}"><div class="knob"></div></div>
          <textarea style="display:none">${it.content.replace(/</g,'&lt;')}</textarea>`;
        const toggle=row.querySelector('.toggle');
        toggle.onclick=()=>{
          it.enabled=!it.enabled;
          toggle.classList.toggle('on');
          const l=loadPresets();
          const target=l.find(pp=>pp.id===preset.id);
          if(target)target.items[idx].enabled=it.enabled;
          savePresets(l);
        };
        const nameEl=row.querySelector('.pname');
        const ta=row.querySelector('textarea');
        nameEl.style.cursor='pointer';
        nameEl.onclick=()=>{ta.style.display=ta.style.display==='none'?'block':'none';};
        ta.onblur=()=>{
          const l=loadPresets();
          const target=l.find(pp=>pp.id===preset.id);
          if(target){target.items[idx].content=ta.value;savePresets(l);}
        };
        body.appendChild(row);
      });
      item.querySelector('[data-act=use]').onclick=(e)=>{
        e.stopPropagation();
        saveJSON('ai-phone-active-preset',loadJSON('ai-phone-active-preset',null)===preset.id?null:preset.id);
        renderList();
      };
      item.querySelector('.plist-head').onclick=(e)=>{
        if(e.target.dataset.del||e.target.closest('[data-act]'))return;
        body.classList.toggle('open');
      };
      item.querySelector('[data-del]').onclick=(e)=>{
        e.stopPropagation();
        const l=loadPresets().filter(pp=>pp.id!==preset.id);
        savePresets(l);
        if(loadJSON('ai-phone-active-preset',null)===preset.id)saveJSON('ai-phone-active-preset',null);
        renderList();
      };
      box.appendChild(item);
    });
  }
  renderList();
  div._refresh=renderList;
  return div;
}

/* ---------------- world book ---------------- */
function loadWorldbooks(){return loadJSON('ai-phone-worldbooks',[]);}
function saveWorldbooks(list){saveJSON('ai-phone-worldbooks',list);}
const SCOPE_LABEL={all:'全部',online:'仅线上',offline:'仅线下'};
function nextScope(s){return s==='all'?'online':(s==='online'?'offline':'all');}

function parseWorldbook(json,name){
  const raw=json.entries||{};
  const arr=Array.isArray(raw)?raw:Object.values(raw);
  const items=arr.map(e=>({
    comment:e.comment||'(无标题)',
    key:(e.key||[]).join(', '),
    content:e.content||'',
    enabled:!e.disable,
    constant:!!e.constant,
    position:e.position,
    depth:e.depth,keys:e.key||[],keys2:e.keysecondary||[],selective:!!e.selective,logic:e.selectiveLogic||0,order:e.order||0,role:e.role||0,
    scope:'all',...wiExtra(e),
  }));
  return{id:'wb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:name,items:items};
}

/* ---------------- regex (grouped) ---------------- */
function loadRegexGroups(){return loadJSON('ai-phone-regex',[]);}
function saveRegexGroups(list){saveJSON('ai-phone-regex',list);}
let _uidSeq=0;
function uid(p){return p+Date.now().toString(36)+(++_uidSeq)+Math.random().toString(36).slice(2,5);}
function ensureGroup(list,name){
  let g=list.find(x=>x.name===name);
  if(!g){g={id:'grp_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name:name,scripts:[]};list.push(g);}
  return g;
}

/* ---------------- PNG chara chunk parsing ---------------- */
function bytesToBinaryString(bytes){
  let result='';
  const chunkSize=8192;
  for(let i=0;i<bytes.length;i+=chunkSize){
    result+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunkSize));
  }
  return result;
}
function parsePngTextChunks(buf){
  const bytes=new Uint8Array(buf);
  const dv=new DataView(buf);
  const result={};
  let i=8;
  while(i<bytes.length-8){
    const length=dv.getUint32(i);
    const type=String.fromCharCode(bytes[i+4],bytes[i+5],bytes[i+6],bytes[i+7]);
    if(type==='tEXt'){
      const chunkStart=i+8,chunkEnd=chunkStart+length;
      let nul=chunkStart;
      while(nul<chunkEnd&&bytes[nul]!==0)nul++;
      const keyword=bytesToBinaryString(bytes.slice(chunkStart,nul));
      const text=bytesToBinaryString(bytes.slice(nul+1,chunkEnd));
      result[keyword]=text;
    }
    if(type==='IEND')break;
    i+=8+length+4;
  }
  return result;
}
function base64ToJson(b64text){
  const bin=atob(b64text);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
function makeAvatarThumb(buf,mime){
  return new Promise(resolve=>{
    const blob=new Blob([buf],{type:mime||'image/png'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      const size=96;
      const canvas=document.createElement('canvas');
      canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d');
      const s=Math.max(size/img.width,size/img.height);
      const w=img.width*s,h=img.height*s;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve(null);};
    img.src=url;
  });
}

function toRegex(findStr){
  const m=/^\/([\s\S]*)\/([a-z]*)$/i.exec(findStr||'');
  try{
    if(m){let f=m[2];if(!f.includes('g'))f+='g';return new RegExp(m[1],f);}

  }catch(e){return null;}
}
function collectActiveRegexScripts(charName,presetName,charId){

    else if(g.charId)ok=(g.charId===charId);                          // 角色卡导入的分组:只对该角色生效
    else if(g.name===charName||(presetName&&g.name===presetName))ok=true; // 预设分组:当前预设
    if(ok)scripts=scripts.concat((g.scripts||[]).filter(s=>s.enabled));

/* role: 'user'|'ai'; mode: 'display'(只影响显示) | 'prompt'(只影响发给模型);markdownOnly=仅显示,promptOnly=仅提示词,都不勾=全部 */
function applyRegexList(text,scripts,role,mode,ctx){
  let out=normNL(text);
  ctx=ctx||{};
  const cName=ctx.char||'',uName=ctx.user||'';
  const esc1=t=>t.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
  scripts.forEach(s=>{
    if(!(role==='user'?s.userTarget:s.aiTarget))return;
    if(mode==='display'&&s.promptOnly&&!s.markdownOnly)return;   // 只勾「提示词」→ 不影响显示
    if(mode==='prompt'&&s.markdownOnly&&!s.promptOnly)return;    // 只勾「前端显示」→ 不影响提示词
    if(ctx.depth!=null){
      if(s.minDepth!=null&&ctx.depth<s.minDepth)return;
      if(s.maxDepth!=null&&ctx.depth>s.maxDepth)return;
    }
    const re=toRegex(String(s.find||'').replace(/{{char}}/gi,()=>esc1(cName)).replace(/{{user}}/gi,()=>esc1(uName)));
    if(!re)return;
    const rep=String(s.replace||'');
    try{
      // 用函数式替换:替换内容里的 $&、$' 等(HTML/JS 里很常见)不会被当成特殊占位符
      out=out.replace(re,(...a)=>{
        const gi=a.findIndex(x=>typeof x==='number');
        const groups=a.slice(0,gi);
        (s.trim||[]).forEach(t=>{if(t)groups[0]=groups[0].split(t).join('');});
        return rep.replace(/\$(\d{1,2})|{{match}}|{{char}}|{{user}}/gi,(m,n)=>
          n!==undefined?(groups[+n]!==undefined?groups[+n]:m):/match/i.test(m)?groups[0]:/char/i.test(m)?cName:uName);
      });
    }catch(e){}
  });
  return out;
}

/* ---- 富文本渲染:```html 围栏 / 整页 HTML / 块级 HTML → 沙盒 iframe(无 same-origin,读不到 localStorage 里的 API Key) ---- */
function mdInline(t){
  return t.replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*\*([^*\n]+)\*\*\*/g,'<b><i>$1</i></b>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>').replace(/~~([^~\n]+)~~/g,'<s>$1</s>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)"']+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(src){
  const lines=esc(normNL(src)).split('\n'),out=[];let para=[],list=null,quote=[];
  const fP=()=>{if(para.length){out.push('<p>'+mdInline(para.join('<br>'))+'</p>');para=[];}};
  const fL=()=>{if(list){out.push('<'+list.t+'>'+list.i.map(x=>'<li>'+mdInline(x)+'</li>').join('')+'</'+list.t+'>');list=null;}};
  const fQ=()=>{if(quote.length){out.push('<blockquote>'+mdInline(quote.join('<br>'))+'</blockquote>');quote=[];}};
  const flush=()=>{fP();fL();fQ();};
  for(let i=0;i<lines.length;i++){
    const l=lines[i];let m;
    if(/^```/.test(l)){flush();const c=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))c.push(lines[i++]);out.push('<pre><code>'+c.join('\n')+'</code></pre>');continue;}
    if(!l.trim()){flush();continue;}
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)){flush();out.push('<hr>');continue;}
    if((m=/^(#{1,6})\s+(.*)$/.exec(l))){flush();out.push('<h'+m[1].length+'>'+mdInline(m[2])+'</h'+m[1].length+'>');continue;}
    if((m=/^&gt;\s?(.*)$/.exec(l))){fP();fL();quote.push(m[1]);continue;}
    if((m=/^\s*([-*+]|\d+\.)\s+(.*)$/.exec(l))){fP();fQ();const t=/\d/.test(m[1])?'ol':'ul';if(list&&list.t!==t)fL();if(!list)list={t,i:[]};list.i.push(m[2]);continue;}
    fL();fQ();para.push(l);
  }
  flush();return out.join('');
}
function avImg(a){return a?'<img class="avatar" style="width:26px;height:26px;border-radius:8px" src="'+a+'">':'';}
const BLOCK_HTML=/<(div|style|table|section|details|svg|center|h[1-6]|ul|ol|p|iframe)[\s>]/i;
function splitRich(t){
  const out=[],re=/```(\w*)[ \t]*\n([\s\S]*?)```/g;let last=0,m;
  while((m=re.exec(t))){
    if(m.index>last)out.push({k:'t',v:t.slice(last,m.index)});
    out.push(m[1].toLowerCase()==='html'||/^\s*(<!doctype|<html)/i.test(m[2])?{k:'h',v:m[2]}:{k:'c',v:m[2]});
    last=re.lastIndex;
  }
  if(last<t.length)out.push({k:'t',v:t.slice(last)});
  return out;
}
function htmlDoc(src){

}

/* ---- 世界书激活:常驻 / 关键词(含 /正则/、次要关键词逻辑)/ 按 position 归位 / 角色卡内嵌书只对该角色生效 ---- */
function wiPos(p){return typeof p==='string'?(p==='after_char'?1:0):(p||0);}
function kwHit(keys,hay,cs,ww){
  return keys.some(k=>{
    k=String(k).trim();if(!k)return false;
    const m=/^\/([\s\S]+)\/([a-z]*)$/i.exec(k);
    try{
      if(m)return new RegExp(m[1],m[2]).test(hay);
      if(ww)return new RegExp('(?<![\\p{L}\\p{N}_])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}\\p{N}_])',cs?'u':'iu').test(hay);
      return cs?hay.includes(k):hay.toLowerCase().includes(k.toLowerCase());
    }catch(e){return false;}
  });
}
/* 世界书(接近 SillyTavern):常驻/关键词/正则/次要关键词逻辑、单条扫描深度、大小写/整词、概率、递归激活(最多 3 轮,支持 excludeRecursion/preventRecursion/delayUntilRecursion)、position 0-6。未实现:sticky/cooldown/delay、token 预算、包含组 */
function activeWorldInfo(char,msgs,scope){
  const out={before:[],after:[],depth:[],emTop:[],emBottom:[]},items=[];
  loadWorldbooks().forEach(wb=>{
    if(wb.fromCharacter&&char.worldbookId!==wb.id)return;
    wb.items.forEach(it=>{if(it.enabled&&it.content&&(it.scope==='all'||it.scope===scope))items.push(it);});
  });
  const hits=[],done=new Set();let rec='';
  for(let pass=0;pass<4;pass++){
    let added=false;
    items.forEach(it=>{
      if(done.has(it)||(pass>0&&it.excludeRecursion)||(pass===0&&it.delayUntilRecursion))return;
      const hay=msgs.slice(-(it.scanDepth||4)).join('\n')+(pass>0?'\n'+rec:'');
      const keys=it.keys||(it.key?it.key.split(/\s*,\s*/):[]),cs=!!it.caseSensitive,ww=!!it.matchWholeWords;
      let ok=!!it.constant||(keys.length>0&&kwHit(keys,hay,cs,ww));
      if(ok&&!it.constant&&it.selective&&(it.keys2||[]).length){
        const any=kwHit(it.keys2,hay,cs,ww),all=it.keys2.every(k=>kwHit([k],hay,cs,ww)),L=it.logic||0;
        ok=L===0?any:L===1?!all:L===2?!any:all;
      }
      if(!ok)return;
      done.add(it);
      if(it.useProbability!==false&&it.probability!=null&&it.probability<100&&Math.random()*100>=it.probability)return;
      hits.push(it);added=true;
      if(!it.preventRecursion)rec+='\n'+it.content;
    });
    if(!added)break;
  }
  hits.sort((a,b)=>(a.order||0)-(b.order||0)).forEach(it=>{
    const p=wiPos(it.position);
    if(p===4)out.depth.push({depth:it.depth!=null?it.depth:4,role:['system','user','assistant'][it.role||0]||'system',content:it.content});
    else if(p===5)out.emTop.push(it.content);else if(p===6)out.emBottom.push(it.content);
    else if(p===0)out.before.push(it.content);else out.after.push(it.content);
  });
  return out;
}

/* 历史:线上线下共用。开启「历史互通」时,另一边最近 30 条按时间混入,并加【线上聊天】/【线下剧情】前缀 */
const HIST_TAG={online:'【线上聊天】',offline:'【线下剧情】'};
function collectHistory(char,scope,state){
  const preset=getActivePreset(),scripts=collectActiveRegexScripts(char.name,preset&&preset.name,char.id);
  const ctx={char:char.name,user:getPersonaName()};
  const offMsgs=(msgs,depthOn)=>{const out=[],n=msgs.length;msgs.forEach((m,i)=>{
    let t=m.swipes[m.swipeIndex]||'';const ei=t.indexOf(ERR_PREFIX);
    if(ei===0)return;if(ei>0)t=t.slice(0,ei).trim();
    const role=m.role==='ai'?'ai':'user';
    if(role==='ai'){t=splitCot(t).body;if(!depthOn)t=extractBody(t);}
    t=applyRegexList(t,scripts,role,'prompt',depthOn?Object.assign({},ctx,{depth:n-1-i}):ctx);
    out.push({role:role==='ai'?'assistant':'user',content:t,ts:m.ts||0});});return out;};
  const wx=msgs=>msgs.map(m=>({role:m.role==='ai'?'assistant':'user',content:m.quote?'[引用「'+m.quote+'」] '+m.text:m.text,ts:m.ts||0}));
  const own=scope==='online'?wx(limitRounds(state.messages,ctxRounds('online'))):offMsgs(limitRounds(state.messages,ctxRounds('offline')),true);
  if(!own.length||!loadJSON('ai-phone-share-history',true))return own;
  const last=own[own.length-1].ts||Infinity,tag=HIST_TAG[scope==='online'?'offline':'online'];
  const other=(scope==='online'?offMsgs(limitRounds(loadOfflineState(char.id).messages,ctxRounds('offline')),false):wx(limitRounds(loadWx(char.id).messages,ctxRounds('online'))))
    .filter(m=>m.ts&&m.ts<=last).slice(-30).map(m=>Object.assign({},m,{content:tag+m.content}));
  return own.concat(other).sort((a,b)=>a.ts-b.ts);
}

/* 提示词组装:完全按当前预设(默认预设或导入预设)的条目顺序,线上线下共用;条目 scope 决定在哪边生效 */
function buildPrompt(char,state,scope){
  const preset=getActivePreset(),mac=t=>applyAllMacros(t,char.name,char);
  const hist=collectHistory(char,scope,state);
  const wi=activeWorldInfo(char,hist.map(h=>h.content),scope);
  const fill={main:char.systemPrompt,worldInfoBefore:wi.before.join('\n'),worldInfoAfter:wi.after.join('\n'),charDescription:char.description,
    personaDescription:personaText(),charPersonality:char.personality,scenario:char.scenario,
    dialogueExamples:[wi.emTop.join('\n'),char.mesExample,wi.emBottom.join('\n')].filter(x=>x&&String(x).trim()).join('\n'),
    onlineHint:scope==='online'?ONLINE_HINT:'',timeInfo:timeText(),postHistory:char.postHistoryInstructions};
  const order=preset.items.filter(i=>i.enabled!==false&&(!i.scope||i.scope==='all'||i.scope===scope));
  const legacyPost=!preset.items.some(i=>i.identifier==='postHistory');
  if(scope==='online'&&!preset.items.some(i=>i.identifier==='onlineHint')){ // 导入的预设没有线上提示词条目时自动补上
    const k=order.findIndex(i=>i.identifier==='chatHistory');order.splice(k<0?order.length:k,0,{marker:true,identifier:'onlineHint'});
  }
  if(!preset.items.some(i=>i.identifier==='timeInfo')){ // 导入的预设没有时间条目时,也在聊天历史前自动补上(设置里选「关闭」即不注入)
    const k=order.findIndex(i=>i.identifier==='chatHistory');order.splice(k<0?order.length:k,0,{marker:true,identifier:'timeInfo'});
  }
  const head=[],tail=[],inj=[];let afterHist=false;
  order.forEach(it=>{
    if(it.marker){
      if(it.identifier==='chatHistory'){afterHist=true;return;}
      const c=fill[it.identifier];
      if(c&&String(c).trim())(afterHist?tail:head).push({role:'system',content:mac(c)});
      return;
    }
    if(!it.content||!String(it.content).trim())return;
    const role=(it.role==='user'||it.role==='assistant')?it.role:'system';
    if(it.injPos===1){inj.push({depth:it.injDepth!=null?it.injDepth:4,role,content:mac(it.content)});return;}
    (afterHist?tail:head).push({role,content:mac(it.content)});
  });
  wi.depth.forEach(d=>inj.push({depth:d.depth,role:d.role,content:mac(d.content)}));
  if(legacyPost&&char.postHistoryInstructions&&String(char.postHistoryInstructions).trim())tail.push({role:'system',content:mac(char.postHistoryInstructions)});
  const body=hist.map(h=>({role:h.role,content:h.content}));
  inj.sort((a,b)=>b.depth-a.depth).forEach(d=>body.splice(Math.max(0,body.length-d.depth),0,{role:d.role,content:d.content}));
  return head.concat(body,tail);
}
function buildMessagesForAPI(char,state,scope){return buildPrompt(char,state,scope||'offline');}

/* 流式请求(SSE);服务端不支持流式时自动退回普通请求。opts:{signal,onDelta(fullText)} */
async function callLLM(msgs,opts){
  opts=opts||{};
  const cfg=loadJSON('ai-phone-settings',{});
  if(!cfg.llm||!cfg.llm.baseUrl)throw new Error('还没在"设置"里填 LLM API 的 Base URL');
  const url=cfg.llm.baseUrl.replace(/\/$/,'')+'/chat/completions';
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+(cfg.llm.apiKey||'')};
  async function doFetch(stream){
    const body={model:cfg.llm.model,messages:msgs};
    if(stream)body.stream=true;
    return fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:opts.signal});
  }
  let res=await doFetch(true);
  if(!res.ok&&(res.status===400||res.status===422))res=await doFetch(false);
  if(!res.ok){
    let msg='HTTP '+res.status;
    try{const d=await res.json();msg=(d.error&&d.error.message)||d.message||msg;}catch(e){}
    throw new Error(msg);
  }
  const ct=res.headers.get('content-type')||'';
  if(!res.body||ct.indexOf('text/event-stream')<0){
    const data=await res.json();
    const text=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'';
    if(!text)throw new Error('接口返回里没有回复内容');
    if(opts.onDelta)opts.onDelta(text);
    return text;
  }
  const reader=res.body.getReader();
  const dec=new TextDecoder();
  let buf='',full='';
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).replace(/\r$/,'');
      buf=buf.slice(i+1);
      if(line.indexOf('data:')!==0)continue;
      const payload=line.slice(5).trim();
      if(!payload||payload==='[DONE]')continue;
      let j;
      try{j=JSON.parse(payload);}catch(e){continue;}
      if(j.error)throw new Error(j.error.message||JSON.stringify(j.error));
      const c=j.choices&&j.choices[0];
      const piece=c&&((c.delta&&c.delta.content)||(c.message&&c.message.content));
      if(piece){full+=piece;if(opts.onDelta)opts.onDelta(full);}
    }
  }
  if(!full)throw new Error('接口返回里没有回复内容');
  return full;
}

function makeOfflineScreen(){
  const div=document.createElement('div');

  div.innerHTML=`
    <header><span class="back">‹ 返回</span><h2 id="of-title">线下</h2><span id="of-switch" style="font-size:12px;color:var(--accent);cursor:pointer">设置</span></header>
    <div class="body" style="display:flex;flex-direction:column;padding:0;flex:1;">
      <div id="of-charpick"></div>
      <div id="of-chat" style="display:none;flex:1;overflow-y:auto;padding:14px;"></div>
      <div id="of-inputbar" style="display:none;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--glass-border);gap:8px;">
        <textarea id="of-input" rows="1" placeholder="输入消息…"></textarea>
        <button class="primary" id="of-send" style="width:64px;flex:0 0 auto;padding:10px 0;">发送</button>
      </div>
    </div>`;
  const $=sel=>div.querySelector(sel);
  $('.back').onclick=closeAllScreens;
  let activeChar=null;
  let inPicker=true;
  let pending=null; // {charId,controller,text,startTs,timer,scripts,ctx}

  function greetingList(ch){
    return [ch.firstMes,...(ch.altGreetings||[])].filter(g=>g&&String(g).trim()).map(g=>applyAllMacros(g,ch.name));
  }
  function initGreeting(ch,state){
    const gs=greetingList(ch);
    if(!gs.length)return false;
    state.messages.push({id:'m0',role:'ai',name:ch.name,avatar:ch.avatar,ts:Date.now(),swipes:gs,swipeIndex:0,starred:false,isGreeting:true,_gm:true});
    return true;
  }
  // 老存档:开场白只存了被选中的那一条,这里一次性把其余开场白补成可翻页的候选
  function mergeGreetings(ch,state){
    const m=state.messages[0];
    if(!m||m.id!=='m0'||m._gm)return false;
    m._gm=true;m.isGreeting=true;
    if(m.swipes.length>1)return true;
    const gs=greetingList(ch);
    if(gs.length<2)return true;
    const cur=m.swipes[m.swipeIndex]||'';
    let k=gs.indexOf(cur);
    if(k<0){gs.unshift(cur);k=0;}
    m.swipes=gs;m.swipeIndex=k;
    return true;
  }

  function openSettings(){
    const c=loadCot(),mask=document.createElement('div');
    mask.style.cssText='position:absolute;inset:0;z-index:30;background:var(--bg-mid);overflow-y:auto;padding:18px';
    const f=(k,l)=>'<div style="margin:12px 0 4px;font-size:12px;color:var(--ink-faint)">'+l+'</div><input data-k="'+k+'" style="width:100%" value="'+esc(c[k]||'').replace(/"/g,'&quot;')+'">';
    mask.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">线下设置</b><span id="os-x" style="color:var(--accent);cursor:pointer">关闭</span></div>'
      +'<div class="importbtn" id="os-sw" style="margin:14px 0">🔄 切换角色'+(activeChar&&!inPicker?'(当前:'+esc(activeChar.name)+')':'')+'</div>'
      +'<div style="font-size:14px;font-weight:600;margin-top:8px">思维链 / 正文标签</div>'
      +'<div style="font-size:11.5px;color:var(--ink-faint);margin-top:4px;line-height:1.6">思维链:标签内的内容在气泡顶部折叠显示,发给模型的历史里会被去掉。<br>正文:填了前后缀后,气泡只显示标签之间的内容(隐藏标签本身);留空则不处理。模型输出的原文始终完整保存。</div>'
      +f('thinkOpen','思维链前缀')+f('thinkClose','思维链后缀')+f('bodyOpen','正文前缀(留空=不提取)')+f('bodyClose','正文后缀')
      +'<button class="primary" id="os-ok" style="width:100%;margin-top:18px">保存</button>';
    mask.querySelector('#os-x').onclick=()=>mask.remove();
    mask.querySelector('#os-sw').onclick=()=>{mask.remove();showCharPicker();};
    mask.querySelector('#os-ok').onclick=()=>{const v={};mask.querySelectorAll('input[data-k]').forEach(i=>v[i.dataset.k]=i.value.trim());saveJSON('ai-phone-cot',v);mask.remove();if(activeChar&&!inPicker)renderMessages('keep');};
    div.appendChild(mask);
  }
  function showCharPicker(){
    inPicker=true;
    $('#of-chat').style.display='none';
    $('#of-inputbar').style.display='none';
    $('#of-title').textContent='线下';
    const box=$('#of-charpick');
    box.style.display='block';box.style.padding='14px';
    const chars=loadCharacters();
    if(chars.length===0){box.innerHTML='<div class="emptylist">还没有导入任何角色卡,先去"角色"app导入一张</div>';return;}
    box.innerHTML='';
    chars.forEach(ch=>{
      const row=document.createElement('div');
      row.className='plist-item';row.style.cursor='pointer';
      row.innerHTML=`<div class="plist-head"><img class="avatar" src="${ch.avatar||''}"><div style="flex:1"><div class="nm">${esc(ch.name)}</div><div class="sub">点击开始对话</div></div></div>`;
      row.onclick=()=>openChat(ch);
      box.appendChild(row);
    });
  }

  function openChat(ch){
    inPicker=false;
    activeChar=ch;saveActiveCharId(ch.id);
    $('#of-title').textContent=ch.name;
    $('#of-charpick').style.display='none';
    $('#of-chat').style.display='block';
    $('#of-inputbar').style.display='flex';
    const state=loadOfflineState(ch.id);
    const dirty=state.messages.length===0?initGreeting(ch,state):mergeGreetings(ch,state);
    if(dirty)saveOfflineState(ch.id,state);
    updateSendBtn();
    renderMessages('bottom');
  }

  function fmtTs(t){const d=new Date(t);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
  function isPendingHere(){return !!(pending&&activeChar&&pending.charId===activeChar.id);}
  function updateSendBtn(){
    const b=$('#of-send');
    b.textContent=pending?'停止':'发送';
    b.style.background=pending?'var(--danger)':'';
    b.style.color=pending?'#fff':'';
  }
  function updatePendingStatus(){
    if(!isPendingHere())return;
    const st=$('#of-pstatus');if(!st)return;
    const sec=Math.floor((Date.now()-pending.startTs)/1000);
    const n=pending.text.length;
    st.textContent=n?`✍️ 生成中 · ${n} 字 · ${sec}s`:`⏳ 等待响应… ${sec}s`;
  }
  function updatePendingText(){
    if(!isPendingHere())return;
    const tx=$('#of-ptext');if(!tx)return;
    const chat=$('#of-chat');
    const near=chat.scrollHeight-chat.scrollTop-chat.clientHeight<140;
    const sp=splitCot(pending.text),shown=extractBody(sp.body);
    tx.classList.add('md');tx.innerHTML=shown?mdToHtml(applyRegexList(shown,pending.scripts,'ai','display',pending.ctx)):(sp.think?'💭 思考中… '+sp.think.length+' 字':'…');
    updatePendingStatus();
    if(near)chat.scrollTop=chat.scrollHeight;
  }
  function stopGeneration(){if(pending)pending.controller.abort();}

  /* scrollMode: 'bottom' | 'keep' | 'top' */
  function renderMessages(scrollMode){
    if(!activeChar)return;
    const state=loadOfflineState(activeChar.id);
    const chat=$('#of-chat');
    const prevScroll=chat.scrollTop;
    chat.style.display='block';
    chat.innerHTML='';
    const preset=getActivePreset();
    const scripts=collectActiveRegexScripts(activeChar.name,preset&&preset.name,activeChar.id);
    const ctx={char:activeChar.name,user:getPersonaName()};

    if(state.messages.length===0&&!isPendingHere()){
      const e=document.createElement('div');
      e.className='emptylist';
      e.innerHTML='还没有消息<br><br><span class="importbtn" style="display:inline-block;padding:10px 18px;margin:0" id="of-reinit">载入开场白</span>';
      e.querySelector('#of-reinit').onclick=()=>{
        const st=loadOfflineState(activeChar.id);
        if(initGreeting(activeChar,st)){saveOfflineState(activeChar.id,st);renderMessages('top');}
        else alert('这个角色没有开场白');
      };
      chat.appendChild(e);
    }

    const lastIdx=state.messages.length-1;
    state.messages.forEach((m,idx)=>{
      const isAI=m.role==='ai';
      const text=m.swipes[m.swipeIndex]||'';
      const isLastAI=isAI&&idx===lastIdx&&idx>0&&m.id!=='m0';
      const showNav=isAI&&(m.swipes.length>1||isLastAI);
      const bubble=document.createElement('div');
      bubble.className='chatmsg';
      bubble.innerHTML=`
        <div class="bubblehead">
          ${avImg(isAI?m.avatar:loadPersona().avatar)}
          <span class="bname">${esc(m.name)}</span>
          <span class="bts">${fmtTs(m.ts)}</span>
        </div>
        <div class="bubblebox"><div class="bubbletext"></div>${showNav?`<div class="swipenav"><span class="arrow" data-sw="-1">‹</span><span class="pg">${m.swipeIndex+1}/${m.swipes.length}</span><span class="arrow" data-sw="1">›</span></div>`:''}</div>
        <div class="bubbletools">
          <span data-act="star">${m.starred?'★ 收藏':'☆ 收藏'}</span>
          <span data-act="edit">编辑</span>
          <span data-act="del">删除</span>
          ${isLastAI?'<span data-act="regen">重新生成</span>':''}
        </div>`;
      const sp=isAI?splitCot(text):{think:'',body:text},shown=isAI?extractBody(sp.body):text;
      renderRich(bubble.querySelector('.bubbletext'),applyRegexList(shown,scripts,isAI?'ai':'user','display',Object.assign({},ctx,{depth:lastIdx-idx})));
      if(sp.think){const d=document.createElement('details');d.className='cot';d.innerHTML='<summary>💭 思维链</summary><div class="cotbody"></div>';d.querySelector('.cotbody').textContent=sp.think;bubble.querySelector('.bubblebox').prepend(d);}

      bubble.querySelectorAll('[data-sw]').forEach(a=>{
        a.onclick=()=>{
          if(pending)return;
          const dir=parseInt(a.dataset.sw,10);
          const st=loadOfflineState(activeChar.id);
          const mm=st.messages[idx];
          if(!mm)return;
          const n=mm.swipes.length;
          if(dir>0&&mm.swipeIndex===n-1&&isLastAI){regenerate(idx);return;}
          mm.swipeIndex=(mm.swipeIndex+dir+n)%n;
          saveOfflineState(activeChar.id,st);
          renderMessages(idx===0?'top':'keep');
        };
      });
      bubble.querySelector('[data-act=star]').onclick=()=>{
        const st=loadOfflineState(activeChar.id);st.messages[idx].starred=!st.messages[idx].starred;
        saveOfflineState(activeChar.id,st);renderMessages('keep');
      };
      bubble.querySelector('[data-act=del]').onclick=()=>{
        if(pending)return;
        const st=loadOfflineState(activeChar.id);st.messages.splice(idx,1);
        saveOfflineState(activeChar.id,st);renderMessages('keep');
      };
      bubble.querySelector('[data-act=edit]').onclick=()=>{
        const ta=document.createElement('textarea');
        ta.value=text;
        ta.style.cssText='width:100%;min-height:120px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--ink);font-size:14px;line-height:1.6;padding:10px 12px;font-family:inherit;outline:none;';
        bubble.querySelector('.bubbletext').replaceWith(ta);
        ta.style.height=Math.min(ta.scrollHeight+4,420)+'px';
        ta.onblur=()=>{
          const st=loadOfflineState(activeChar.id);
          if(st.messages[idx]){
            st.messages[idx].swipes[st.messages[idx].swipeIndex]=ta.value;
            saveOfflineState(activeChar.id,st);
          }
          renderMessages('keep');
        };
        ta.focus();
      };
      const regenBtn=bubble.querySelector('[data-act=regen]');
      if(regenBtn)regenBtn.onclick=()=>regenerate(idx);
      chat.appendChild(bubble);
    });

    if(isPendingHere()){
      const pb=document.createElement('div');
      pb.className='chatmsg';
      pb.innerHTML=`
        <div class="bubblehead">
          ${activeChar.avatar?'<img class="avatar" style="width:26px;height:26px;border-radius:8px" src="'+activeChar.avatar+'">':''}
          <span class="bname">${esc(activeChar.name)}</span>
          <span class="bts" id="of-pstatus" style="color:var(--accent)"></span>
        </div>
        <div class="bubbletext" id="of-ptext">…</div>
        <div class="bubbletools"><span data-act="stop" style="color:var(--danger)">■ 停止生成</span></div>`;
      pb.querySelector('[data-act=stop]').onclick=stopGeneration;
      chat.appendChild(pb);
      updatePendingText();
    }

    if(scrollMode==='keep')chat.scrollTop=prevScroll;
    else if(scrollMode==='top')chat.scrollTop=0;
    else chat.scrollTop=chat.scrollHeight;
  }

  function finalText(r){
    if(r.errMsg){
      const hint=/Failed to fetch|NetworkError|Load failed/i.test(r.errMsg)?'(网络不通、被 CORS 拦截,或 Base URL 填错了)':'';
      return (r.text?r.text+'\n\n':'')+ERR_PREFIX+':'+r.errMsg+hint;
    }
    return r.text||null;
  }

  async function runGeneration(ch,msgs){
    const state=loadOfflineState(ch.id);
    const preset=getActivePreset();
    pending={
      charId:ch.id,controller:new AbortController(),text:'',startTs:Date.now(),
      scripts:collectActiveRegexScripts(ch.name,preset&&preset.name,ch.id),
      ctx:{char:ch.name,user:getPersonaName()},
    };
    pending.timer=setInterval(updatePendingStatus,500);
    updateSendBtn();
    renderMessages('bottom');
    let text='',errMsg=null;
    try{
      text=await callLLM(msgs,{
        signal:pending.controller.signal,
        onDelta:t=>{if(pending){pending.text=t;updatePendingText();}},
      });
    }catch(e){
      text=pending?pending.text:'';
      if(!(e&&e.name==='AbortError'))errMsg=(e&&e.message)||String(e);
    }
    clearInterval(pending.timer);
    pending=null;
    updateSendBtn();
    return{text:text||'',errMsg};
  }

  async function regenerate(idx){
    if(pending||!activeChar)return;
    const ch=activeChar;
    const state=loadOfflineState(ch.id);
    if(!state.messages[idx])return;
    const msgs=buildMessagesForAPI(ch,{presetId:state.presetId,messages:state.messages.slice(0,idx)});
    const r=await runGeneration(ch,msgs);
    const out=finalText(r);
    const st=loadOfflineState(ch.id);
    const mm=st.messages[idx];
    if(mm&&out!==null){mm.swipes.push(out);mm.swipeIndex=mm.swipes.length-1;saveOfflineState(ch.id,st);}
    if(activeChar&&activeChar.id===ch.id)renderMessages('bottom');
  }

  async function sendMessage(text){
    if(pending||!activeChar)return;
    const ch=activeChar;
    const state=loadOfflineState(ch.id);
    state.messages.push({id:'m_'+Date.now(),role:'user',name:getPersonaName(),ts:Date.now(),swipes:[text],swipeIndex:0,starred:false});
    saveOfflineState(ch.id,state);
    const msgs=buildMessagesForAPI(ch,state);
    const r=await runGeneration(ch,msgs);
    const out=finalText(r);
    const st=loadOfflineState(ch.id);
    if(out!==null){
      st.messages.push({id:'m_'+Date.now()+'a',role:'ai',name:ch.name,avatar:ch.avatar,ts:Date.now(),swipes:[out],swipeIndex:0,starred:false});
    }
    saveOfflineState(ch.id,st);
    if(activeChar&&activeChar.id===ch.id)renderMessages('bottom');
  }

  const inputEl=$('#of-input');
  function autosize(){inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,140)+'px';}
  inputEl.addEventListener('input',autosize);
  inputEl.addEventListener('keydown',(e)=>{
    // 电脑:Enter 发送,Shift+Enter 换行;手机:Enter 就是换行,用右边按钮发送
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!window.matchMedia('(pointer:coarse)').matches){
      e.preventDefault();$('#of-send').click();
    }
  });
  $('#of-switch').onclick=openSettings;
  $('#of-send').onclick=()=>{
    if(pending){stopGeneration();return;}
    const text=inputEl.value.trim();
    if(!text||!activeChar)return;
    inputEl.value='';autosize();
    sendMessage(text);
  };

  div._refresh=()=>{
    if(!inPicker&&activeChar){
      const c=loadCharacters().find(x=>x.id===activeChar.id);
      if(c){activeChar=c;renderMessages('keep');return;}
      activeChar=null;
    }
    showCharPicker();
  };

  const lastCharId=loadActiveCharId();
  const lastChar=lastCharId&&loadCharacters().find(c=>c.id===lastCharId);
  if(lastChar)openChat(lastChar);else showCharPicker();
  return div;
}

/* ---------------- 消息 app(仿微信):微信 / 通讯录 / 发现 / 我 ---------------- */
function loadWx(id){return loadJSON('ai-phone-wx-'+id,{messages:[]});}
function saveWx(id,st){saveJSON('ai-phone-wx-'+id,st);}
function buildWxMessages(ch,st){return buildPrompt(ch,st,'online');}
function makeMessagesScreen(){
  const div=document.createElement('div');div.className='screen';
  div.innerHTML=`<header><span class="back">‹ 返回</span><h2 id="m-title">微信</h2><span style="width:36px"></span></header>
    <div class="body" style="padding:0;display:flex;flex-direction:column;overflow:hidden"><div id="m-main" style="flex:1;overflow-y:auto"></div><div class="wxtabs" id="m-tabs"></div></div>
    <div class="wxchat" id="m-chat"></div>`;
  const $=q=>div.querySelector(q);$('.back').onclick=closeAllScreens;
  const TABS=[['微信','💬'],['通讯录','👥'],['发现','🧭'],['我','🙂']];
  let tab=0,cur=null,busy=false,quote=null,multi=null;
  const fmt=t=>{const d=new Date(t);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');};
  const av=(a,n)=>a?`<img class="avatar" src="${a}">`:`<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:18px">${esc((n||'?').slice(0,1))}</div>`;
  $('#m-tabs').innerHTML=TABS.map((t,i)=>`<div class="wxtab" data-i="${i}"><i>${t[1]}</i>${t[0]}</div>`).join('');
  $('#m-tabs').querySelectorAll('.wxtab').forEach(e=>e.onclick=()=>{tab=+e.dataset.i;render();});
  function render(){
    $('#m-tabs').querySelectorAll('.wxtab').forEach((e,i)=>e.classList.toggle('on',i===tab));
    $('#m-title').textContent=TABS[tab][0];
    const m=$('#m-main'),chars=loadCharacters();m.innerHTML='';
    if(tab===0||tab===1){
      let list=chars;
      if(tab===0)list=chars.map(c=>({c,last:loadWx(c.id).messages.slice(-1)[0]})).filter(x=>x.last).sort((a,b)=>b.last.ts-a.last.ts);
      if(!list.length){m.innerHTML='<div class="emptylist">'+(tab===0?'还没有聊天<br>去「通讯录」点角色开始':'还没有导入角色,先去「角色」app 导入')+'</div>';return;}
      list.forEach(x=>{const c=tab===0?x.c:x,last=tab===0?x.last:null;
        const r=document.createElement('div');r.className='wxrow';
        r.innerHTML=av(c.avatar,c.name)+`<div style="flex:1;min-width:0"><div class="l1">${esc(c.name)}</div>${last?`<div class="l2">${esc(last.text)}</div>`:''}</div>${last?`<div style="font-size:11px;color:var(--ink-faint)">${fmt(last.ts)}</div>`:''}`;
        r.onclick=()=>openChat(c);m.appendChild(r);});
    }else if(tab===2){
      m.innerHTML='<div class="wxrow" id="m-moments"><div style="font-size:22px">🖼️</div><div class="l1">朋友圈</div></div><div class="wxrow" id="m-fav"><div style="font-size:22px">📦</div><div class="l1">收藏</div></div>';
      $('#m-fav').onclick=()=>{const f=loadJSON('ai-phone-favs',[]),box=document.createElement('div');box.id='m-favlist';box.style.padding='8px 16px';
        if(!f.length)box.innerHTML='<div class="emptylist">还没有收藏</div>';
        f.forEach((x,k)=>{const d=document.createElement('div');d.style.cssText='padding:10px 0;border-bottom:1px solid var(--glass-border);font-size:13.5px;white-space:pre-wrap';d.textContent=x.text;
          const sm=document.createElement('div');sm.style.cssText='font-size:11px;color:var(--ink-faint);margin-top:4px';sm.textContent='来自 '+x.name+' · 点击取消收藏';d.appendChild(sm);
          d.onclick=()=>{if(confirm('取消收藏?')){f.splice(k,1);saveJSON('ai-phone-favs',f);$('#m-fav').onclick();}};box.appendChild(d);});
        const old=$('#m-favlist');if(old)old.remove();m.appendChild(box);};
      $('#m-moments').onclick=()=>alert('朋友圈下一步开发');
    }else renderMe();
  }
  function renderMe(){
    const m=$('#m-main'),p=loadPersona();
    m.innerHTML=`<div class="wxrow" id="m-prof" style="padding:22px 16px">${av(p.avatar,getPersonaName())}<div style="flex:1"><div style="font-size:18px;font-weight:600">${esc(getPersonaName())}</div><div class="l2">${esc(p.signature||'点击编辑我的人设')}</div></div><span style="color:var(--ink-faint)">›</span></div><div id="m-edit"></div>`;
    $('#m-prof').onclick=()=>{
      const e=$('#m-edit');if(e.innerHTML){e.innerHTML='';return;}
      e.innerHTML=`<div style="padding:14px 16px"><label>头像</label><input type="file" id="pf-av" accept="image/*" class="wxf"><label>名字(对应宏 {{user}})</label><input class="wxf" id="pf-name" placeholder="留空默认叫 User">
        <label>生日</label><input class="wxf" id="pf-bd" type="date"><label>个性签名</label><input class="wxf" id="pf-sig">
        <label>人设描述(会发给模型)</label><textarea class="wxf" id="pf-desc" style="min-height:110px"></textarea>
        <div class="savebar" style="margin-top:12px"><button class="primary" id="pf-save">保存</button></div></div>`;
      $('#pf-name').value=p.name||'';$('#pf-bd').value=p.birthday||'';$('#pf-sig').value=p.signature||'';$('#pf-desc').value=p.desc||'';
      let newAv=p.avatar;
      $('#pf-av').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;newAv=await makeAvatarThumb(await f.arrayBuffer(),f.type)||newAv;};
      $('#pf-save').onclick=()=>{saveJSON('ai-phone-persona',{name:$('#pf-name').value.trim(),avatar:newAv,birthday:$('#pf-bd').value,signature:$('#pf-sig').value.trim(),desc:$('#pf-desc').value.trim()});renderMe();};
    };
  }
  function openChat(c){
    cur=c;quote=null;multi=null;const ch=$('#m-chat');ch.style.display='flex';
    ch.innerHTML=`<header style="display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px;border-bottom:1px solid var(--glass-border)"><span class="back" id="mc-back" style="cursor:pointer;color:var(--accent)">‹ 返回</span><h2 style="font-size:17px;margin:0;flex:1">${esc(c.name)}</h2></header>
      <div class="wxmsgs" id="mc-msgs"></div>
      <div id="mc-q" style="display:none;gap:10px;align-items:center;padding:8px 14px;font-size:12.5px;color:var(--ink-faint);border-top:1px solid var(--glass-border)"></div>
      <div id="mc-ms" style="display:none;justify-content:space-around;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--glass-border);font-size:14px"><span id="ms-fav" style="cursor:pointer">收藏</span><span id="ms-del" style="cursor:pointer;color:var(--danger)">删除</span><span id="ms-x" style="cursor:pointer;color:var(--accent)">取消</span></div>
      <div id="mc-inrow" style="display:flex;gap:8px;align-items:flex-end;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--glass-border)"><textarea id="mc-in" rows="1" class="wxf" style="flex:1;max-height:120px;resize:none" placeholder="发消息…"></textarea><button class="primary" id="mc-send" style="width:64px;flex:0 0 auto;padding:10px 0">发送</button></div>`;
    ch.querySelector('#mc-back').onclick=()=>{ch.style.display='none';cur=null;render();};
    ch.querySelector('#mc-send').onclick=send;
    ch.querySelector('#ms-x').onclick=()=>{multi=null;mode();};
    ch.querySelector('#ms-del').onclick=()=>{if(multi&&multi.size)del([...multi]);};
    ch.querySelector('#ms-fav').onclick=()=>{if(!multi||!multi.size)return;const s=loadWx(cur.id).messages,f=loadJSON('ai-phone-favs',[]);[...multi].sort((a,b)=>b-a).forEach(k=>s[k]&&f.unshift({charId:cur.id,name:cur.name,text:s[k].text,ts:Date.now()}));saveJSON('ai-phone-favs',f);multi=null;mode();toast('已收藏');};
    ch.querySelector('#mc-in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();send();}});
    draw();
  }
  const toast=t=>{draw(t);setTimeout(()=>{if(cur&&!$('#mc-ms').offsetParent)draw();},1400);};
  function updMs(){$('#ms-del').textContent='删除'+(multi&&multi.size?'('+multi.size+')':'');}
  function mode(){$('#mc-inrow').style.display=multi?'none':'flex';$('#mc-ms').style.display=multi?'flex':'none';updMs();draw();}
  function qbar(){const q=$('#mc-q');q.innerHTML='';q.style.display=quote?'flex':'none';if(!quote)return;
    const t=document.createElement('span');t.style.cssText='flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';t.textContent='引用:'+quote;
    const x=document.createElement('span');x.textContent='✕';x.style.cursor='pointer';x.onclick=()=>{quote=null;qbar();};q.append(t,x);$('#mc-in').focus();}
  function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();}).finally(()=>toast('已复制'));}
  function fav(m){const f=loadJSON('ai-phone-favs',[]);f.unshift({charId:cur.id,name:cur.name,text:m.text,ts:Date.now()});saveJSON('ai-phone-favs',f);toast('已收藏');}
  function del(ix){if(!confirm('删除所选消息?'))return;const st=loadWx(cur.id);st.messages=st.messages.filter((_,k)=>!ix.includes(k));saveWx(cur.id,st);multi=null;mode();}
  function fwd(m){
    const ch=$('#m-chat'),list=loadCharacters().filter(c=>c.id!==cur.id);if(!list.length)return toast('没有可转发的角色');
    const mask=document.createElement('div');mask.style.cssText='position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end';
    const sh=document.createElement('div');sh.style.cssText='width:100%;max-height:60%;overflow-y:auto;background:var(--bg-mid);border-radius:14px 14px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px)';
    sh.innerHTML='<div style="text-align:center;font-size:13px;color:var(--ink-faint);padding:8px">转发给…</div>';
    list.forEach(c=>{const r=document.createElement('div');r.className='wxrow';r.innerHTML=av(c.avatar,c.name)+'<div class="l1">'+esc(c.name)+'</div>';
      r.onclick=()=>{const s=loadWx(c.id);s.messages.push({role:'user',text:'[转发] '+m.text,ts:Date.now()});saveWx(c.id,s);mask.remove();toast('已转发给 '+c.name);};sh.appendChild(r);});
    mask.onclick=e=>{if(e.target===mask)mask.remove();};mask.appendChild(sh);ch.appendChild(mask);
  }
  function menu(b,i,m){
    const ch=$('#m-chat'),cr=ch.getBoundingClientRect(),br=b.getBoundingClientRect(),W=290;
    const acts=[['📄','复制',()=>copy(m.text)],['↪️','转发',()=>fwd(m)],['📦','收藏',()=>fav(m)],['🗑️','删除',()=>del([i])],['☑️','多选',()=>{multi=new Set([i]);mode();}],['❝','引用',()=>{quote=m.text;qbar();}]];
    const mask=document.createElement('div');mask.style.cssText='position:absolute;inset:0;z-index:20';
    const mn=document.createElement('div');
    mn.style.cssText='position:absolute;width:'+W+'px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px 0;padding:14px 6px;background:#4a4a4a;color:#fff;border-radius:10px;font-size:12px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)';
    mn.innerHTML=acts.map((a,k)=>'<div data-k="'+k+'" style="cursor:pointer"><div style="font-size:20px;margin-bottom:3px">'+a[0]+'</div>'+a[1]+'</div>').join('');
    mn.onclick=e=>{const d=e.target.closest('[data-k]');if(!d)return;mask.remove();acts[+d.dataset.k][2]();};
    mask.onclick=e=>{if(e.target===mask)mask.remove();};
    mask.appendChild(mn);ch.appendChild(mask);
    const h=mn.offsetHeight;let left=br.left+br.width/2-W/2-cr.left;left=Math.max(8,Math.min(cr.width-W-8,left));
    let top=br.top-cr.top-h-10;if(top<60)top=br.bottom-cr.top+10;
    mn.style.left=left+'px';mn.style.top=top+'px';
  }
  function pressMenu(b,i,m){
    let t=null,x=0,y=0;
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('pointerdown',e=>{x=e.clientX;y=e.clientY;clearTimeout(t);t=setTimeout(()=>{t=null;menu(b,i,m);},420);});
    b.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-x)>8||Math.abs(e.clientY-y)>8)clearTimeout(t);});
    ['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>clearTimeout(t)));
  }
  function draw(tip){
    const box=$('#mc-msgs');if(!box||!cur)return;const st=loadWx(cur.id),me=loadPersona();box.innerHTML='';
    st.messages.forEach((m,i)=>{const mine=m.role!=='ai';const r=document.createElement('div');r.className='wxm'+(mine?' me':'');
      r.innerHTML=(multi?`<input type="checkbox" ${multi.has(i)?'checked':''} style="order:99;align-self:center;flex:0 0 auto;pointer-events:none">`:'')+av(mine?me.avatar:cur.avatar,mine?getPersonaName():cur.name)+'<div class="wxb" style="user-select:none;-webkit-touch-callout:none"></div>';
      const b=r.querySelector('.wxb');b.textContent=m.text;
      if(m.quote){const q=document.createElement('div');q.style.cssText='font-size:12px;opacity:.65;border-left:2px solid currentColor;padding-left:6px;margin-bottom:5px';q.textContent=m.quote;b.prepend(q);}
      if(multi)r.onclick=()=>{multi.has(i)?multi.delete(i):multi.add(i);r.querySelector('input').checked=multi.has(i);updMs();};
      else pressMenu(b,i,m);
      box.appendChild(r);});
    if(tip){const t=document.createElement('div');t.className='wxsys';t.textContent=tip;box.appendChild(t);}
    box.scrollTop=box.scrollHeight;
  }
  async function send(){
    const inp=$('#mc-in'),text=inp.value.trim();if(!text||busy||!cur)return;
    const c=cur,st=loadWx(c.id);st.messages.push({role:'user',text,ts:Date.now(),quote:quote||undefined});quote=null;qbar();saveWx(c.id,st);inp.value='';busy=true;draw('对方正在输入…');
    try{
      const out=await callLLM(buildWxMessages(c,st));
      let parts=out.trim().split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
      if(parts.length===1&&parts[0].includes('\n'))parts=parts[0].split('\n').map(x=>x.trim()).filter(Boolean);
      const s2=loadWx(c.id);parts.slice(0,8).forEach((t,i)=>s2.messages.push({role:'ai',text:t,ts:Date.now()+i}));saveWx(c.id,s2);draw();
    }catch(e){draw('⚠️ 发送失败:'+((e&&e.message)||e));}
    busy=false;
  }
  div._refresh=()=>{if(!cur)render();};
  render();return div;
}

function buildScreen(id){
  switch(id){
    case 'settings': return makeSettingsScreen();
    case 'presets': return makePresetsScreen();
    case 'offline': return makeOfflineScreen();
    case 'messages': return makeMessagesScreen();
    case 'twitter': return makePlaceholderScreen('推特','🐦','模拟与 AI 角色的社媒动态交互。下一步开发。');
    case 'worldbook': return makeWorldbookScreen();
    case 'regex': return makeRegexScreen();
    case 'characters': return makeCharactersScreen();
  }
}
function openScreen(id){
  if(!builtScreens[id]){
    builtScreens[id]=buildScreen(id);
    screensRoot.appendChild(builtScreens[id]);
  }else if(builtScreens[id]._refresh){
    try{builtScreens[id]._refresh();}catch(e){}
  }
  requestAnimationFrame(()=>builtScreens[id].classList.add('show'));
}
function closeAllScreens(){
  Object.values(builtScreens).forEach(s=>s.classList.remove('show'));
}
function showSavedToast(t){
  // reuse settings msg if open, else ignore
}

    navigator.serviceWorker.register('sw.js').catch(()=>{/* not hosted here yet, ignore */});
